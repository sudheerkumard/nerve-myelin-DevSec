apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: default-wide}
spec:
  sourceRepos: ['*']
  destinations: [{server: '*', namespace: '*'}]
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: payments}
spec:
  source: {repoURL: 'http://git.acme.example/payments.git', targetRevision: main, path: k8s}
  syncPolicy: {automated: {prune: true, selfHeal: true}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: ledger}
spec:
  source: {repoURL: 'https://git.acme.example/ledger.git', targetRevision: v2.4.1, path: k8s}
  syncPolicy: {automated: {prune: true}}
