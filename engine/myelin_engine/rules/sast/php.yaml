# NERvvE DevSecOps SAST rules for PHP (plain PHP, Laravel, Symfony request objects). Original work: not derived
# from the semgrep-rules registry.
rules:
  - id: nervve.php.sql-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      SQL statement built from request data. An attacker can read or change any data the database account can
      reach. Use PDO prepared statements with bound parameters, or the framework's query builder bindings.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: &php_sources
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - pattern: $_FILES
          - pattern: $_SERVER['QUERY_STRING']
          - pattern: $_SERVER['REQUEST_URI']
          - pattern: $_SERVER['HTTP_REFERER']
          - pattern: file_get_contents('php://input')
          - pattern: $request->input(...)
          - pattern: $request->get(...)
          - pattern: $request->query(...)
          - pattern: $request->post(...)
          - pattern: $request->all()
          - pattern: $request->query->get(...)
          - pattern: $request->request->get(...)
          - pattern: request(...)
    pattern-sanitizers: &php_sanitizers
      - pattern-either:
          - pattern: intval(...)
          - pattern: (int) $X
          - pattern: floatval(...)
          - pattern: htmlspecialchars(...)
          - pattern: htmlentities(...)
          - pattern: escapeshellarg(...)
          - pattern: escapeshellcmd(...)
          - pattern: basename(...)
          - pattern: $PDO->quote(...)
          - pattern: mysqli_real_escape_string(...)
          - pattern: filter_var($X, FILTER_VALIDATE_INT, ...)
    pattern-sinks:
      - pattern-either:
          - pattern: mysqli_query($C, ...)
          - pattern: mysql_query(...)
          - pattern: pg_query($C, ...)
          - pattern: $DB->query(...)
          - pattern: $DB->exec(...)
          - pattern: $DB->prepare(...)
          - pattern: DB::raw(...)
          - pattern: DB::select(...)
          - pattern: DB::statement(...)
          - pattern: $Q->whereRaw(...)
          - pattern: $Q->orderByRaw(...)

  - id: nervve.php.command-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Operating-system command built from request data. An attacker can run commands as the web server. Avoid the
      shell; if unavoidable, pass each value through escapeshellarg and allow-list it.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sanitizers: *php_sanitizers
    pattern-sinks:
      - pattern-either:
          - pattern: system(...)
          - pattern: exec(...)
          - pattern: shell_exec(...)
          - pattern: passthru(...)
          - pattern: popen(...)
          - pattern: proc_open(...)
          - pattern: pcntl_exec(...)

  - id: nervve.php.code-injection
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      Request data is executed as PHP code or deserialised (eval, assert, create_function, preg_replace /e,
      unserialize). An attacker can run arbitrary code. Use json_decode for data and never evaluate input.
    metadata:
      cwe: "CWE-94"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: assert(...)
          - pattern: create_function(...)
          - pattern: unserialize(...)
          - pattern: call_user_func(...)
          - pattern: call_user_func_array(...)

  - id: nervve.php.file-inclusion
    mode: taint
    languages: [php]
    severity: ERROR
    message: >-
      A file is included or opened by a path from request data (local/remote file inclusion, path traversal). An
      attacker can read files or run code. Map an identifier to a fixed list of files instead.
    metadata:
      cwe: "CWE-98"
      owasp: "A01:2021 Broken Access Control"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sanitizers: *php_sanitizers
    pattern-sinks:
      - pattern-either:
          - pattern: include $X;
          - pattern: include_once $X;
          - pattern: require $X;
          - pattern: require_once $X;
          - pattern: include($X);
          - pattern: require($X);
          - patterns:
              - pattern-either:
                  - pattern: fopen($P, ...)
                  - pattern: file_get_contents($P, ...)
                  - pattern: file_put_contents($P, ...)
                  - pattern: readfile($P, ...)
                  - pattern: unlink($P, ...)
              - pattern-not: file_get_contents('php://input', ...)
              - pattern-not: file_get_contents("php://input", ...)
              - pattern-not: fopen('php://input', ...)
              - pattern-not: fopen("php://input", ...)
              - focus-metavariable: $P

  - id: nervve.php.ssrf
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      Server-side request to a URL from request data (SSRF). An attacker can reach internal services. Allow-list
      the host and scheme before fetching.
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021 Server-Side Request Forgery"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sanitizers: *php_sanitizers
    pattern-sinks:
      - pattern-either:
          - pattern: curl_init(...)
          - pattern: curl_setopt($CH, CURLOPT_URL, ...)
          - pattern: Http::get(...)
          - pattern: $CLIENT->request($M, ...)

  - id: nervve.php.xss
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      Request data is echoed into the page without HTML encoding (cross-site scripting). Encode output with
      htmlspecialchars($value, ENT_QUOTES, 'UTF-8') or use an auto-escaping template ({{ }} in Blade/Twig).
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sanitizers: *php_sanitizers
    pattern-sinks:
      - pattern-either:
          - pattern: echo ...;
          - pattern: print(...)
          - pattern: printf(...)
          - pattern: die(...)
          - pattern: exit(...)

  - id: nervve.php.open-redirect
    mode: taint
    languages: [php]
    severity: WARNING
    message: >-
      Redirect to a location from request data, usable for phishing. Redirect only to relative paths or an
      allow-list of hosts.
    metadata:
      cwe: "CWE-601"
      owasp: "A01:2021 Broken Access Control"
      confidence: high
      category: injection
    pattern-sources: *php_sources
    pattern-sinks:
      - pattern-either:
          - pattern: 'header("Location: " . $X)'
          - pattern: 'header("Location: $X")'
          - pattern: redirect($X)
          - pattern: redirect()->away($X)

  - id: nervve.php.weak-crypto
    languages: [php]
    severity: WARNING
    message: >-
      A fast hash (md5/sha1) is used for a password, or a weak cipher is used. Use password_hash/password_verify
      for passwords and sodium or openssl with AES-256-GCM for encryption.
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 Cryptographic Failures"
      confidence: medium
      category: crypto
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: md5($PW)
              - pattern: sha1($PW)
          - metavariable-regex:
              metavariable: $PW
              regex: (?i).*(pass|pwd).*
      - patterns:
          - pattern: openssl_encrypt($D, "$ALG", ...)
          - metavariable-regex:
              metavariable: $ALG
              regex: (?i)^(des.*|rc4.*|bf.*|.*-ecb)$
