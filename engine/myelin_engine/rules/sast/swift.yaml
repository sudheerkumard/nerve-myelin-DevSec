# RAT Flea DevSec SAST rules for Swift (iOS and macOS). Original work: not derived from the semgrep-rules registry.
rules:
  - id: nervve.swift.weak-crypto
    languages: [swift]
    severity: WARNING
    message: A broken hash or cipher (MD5, SHA-1, DES, 3DES, RC4, ECB mode) is used. Use SHA-256 and AES-GCM (CryptoKit).
    metadata: {cwe: "CWE-327", owasp: "A02:2021", confidence: high, category: crypto}
    pattern-either:
      - pattern: CC_MD5(...)
      - pattern: CC_SHA1(...)
      - pattern: Insecure.MD5.hash(...)
      - pattern: Insecure.SHA1.hash(...)
      - pattern-regex: '\bkCCAlgorithm(DES|3DES|RC4|RC2|Blowfish)\b|\bkCCOptionECBMode\b'
  - id: nervve.swift.tls-trust-all
    languages: [swift]
    severity: ERROR
    message: >-
      The authentication challenge is answered with the server's own trust object without evaluating it, so any
      certificate is accepted. Let the system evaluate trust (or pin with SecTrustEvaluateWithError).
    metadata: {cwe: "CWE-295", owasp: "A02:2021", confidence: medium, category: crypto}
    pattern-either:
      - pattern-regex: 'completionHandler\(\s*\.useCredential\s*,\s*URLCredential\(\s*trust:\s*[\w.]+serverTrust!?\s*\)\s*\)'
      - pattern-regex: '\ballowsExpiredCertificates\s*=\s*true|\bvalidatesDomainName\s*=\s*false|\bdisableEvaluation\b'
  - id: nervve.swift.keychain-always-accessible
    languages: [swift]
    severity: WARNING
    message: Keychain items marked kSecAttrAccessibleAlways are readable while the device is locked and in backups.
    metadata: {cwe: "CWE-311", owasp: "M9:2024", confidence: high, category: mobile}
    pattern-regex: '\bkSecAttrAccessible(Always|AlwaysThisDeviceOnly)\b'
  - id: nervve.swift.secret-in-userdefaults
    languages: [swift]
    severity: WARNING
    message: A credential is stored in UserDefaults, an unencrypted plist. Store it in the Keychain.
    metadata: {cwe: "CWE-312", owasp: "M9:2024", confidence: medium, category: mobile}
    pattern-regex: 'UserDefaults(\.standard)?\.set\([^\n]*forKey:\s*"[^"]*(?i:password|token|secret|apikey|api_key|session|pin)[^"]*"'
  - id: nervve.swift.sql-injection
    languages: [swift]
    severity: ERROR
    message: SQL built with string interpolation. Bind values with sqlite3_bind_* or the ORM's parameters.
    metadata: {cwe: "CWE-89", owasp: "A03:2021", confidence: medium, category: injection}
    pattern-regex: '\b(sqlite3_exec|sqlite3_prepare_v2|executeQuery|executeUpdate|execute)\([^\n]*"[^"\n]*(SELECT|INSERT|UPDATE|DELETE)[^"\n]*\\\('
  - id: nervve.swift.cleartext-http
    languages: [swift]
    severity: WARNING
    message: The app requests a plain-HTTP URL; traffic can be read or changed on the network. Use HTTPS.
    metadata: {cwe: "CWE-319", owasp: "M5:2024", confidence: medium, category: transport}
    pattern-regex: 'URL\(string:\s*"http://(?!localhost|127\.0\.0\.1)[A-Za-z0-9.-]+\.[a-z]{2,}'
  - id: nervve.swift.uiwebview
    languages: [swift]
    severity: INFO
    message: UIWebView is deprecated and lacks the isolation of WKWebView. Use WKWebView.
    metadata: {cwe: "CWE-1104", owasp: "M8:2024", confidence: high, category: mobile}
    pattern-regex: '\bUIWebView\b'
