# RAT Flea DevSec SAST rules for JavaScript and TypeScript (Node.js: Express, Koa, Fastify, Next.js API routes;
# browser DOM). Original work: not derived from the semgrep-rules registry.
rules:
  - id: nervve.js.sql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      SQL statement built from untrusted request data. An attacker can read or change any data the database
      account can reach. Use placeholders (db.query("... WHERE id = ?", [id])) or the query builder's bindings.
    metadata:
      cwe: "CWE-89"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: &js_sources
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
              - pattern: $REQ.originalUrl
              - pattern: $REQ.header(...)
              - pattern: $REQ.param(...)
              - pattern: $REQ.request.query
              - pattern: $REQ.request.body
          - metavariable-regex:
              metavariable: $REQ
              regex: ^(req|request|ctx|context|event|r)$
      - pattern: process.argv
      - patterns:
          # Express / Koa / Fastify handlers: the first argument is the request
          - pattern-either:
              - pattern-inside: $APP.$METHOD($PATH, ..., function ($REQ, $RES, ...) {...})
              - pattern-inside: $APP.$METHOD($PATH, ..., ($REQ, $RES, ...) => {...})
              - pattern-inside: $APP.$METHOD($PATH, ..., async function ($REQ, $RES, ...) {...})
              - pattern-inside: $APP.$METHOD($PATH, ..., async ($REQ, $RES, ...) => {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|patch|delete|all|use|route|options|head)$
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
    pattern-sanitizers: &js_sanitizers
      - pattern-either:
          - pattern: parseInt(...)
          - pattern: parseFloat(...)
          - pattern: Number(...)
          - pattern: Boolean(...)
          - pattern: encodeURIComponent(...)
          - pattern: escape(...)
          - pattern: validator.escape(...)
          - pattern: validator.isInt(...)
          - pattern: DOMPurify.sanitize(...)
          - pattern: sanitizeHtml(...)
          - pattern: path.basename(...)
          - pattern: $X.length
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($Q, ...)
              - pattern: $DB.execute($Q, ...)
              - pattern: $DB.raw($Q, ...)
              - pattern: $DB.$queryRawUnsafe($Q, ...)
              - pattern: $DB.$executeRawUnsafe($Q, ...)
              - pattern: $DB.sequelize.query($Q, ...)
              - pattern: $KNEX.whereRaw($Q, ...)
          - focus-metavariable: $Q
          # a bare string literal with placeholders is fine; only flag strings built from data
          - pattern-not: '"..."'

  - id: nervve.js.command-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Operating-system command built from untrusted input. An attacker can run any command as the server process.
      Use child_process.execFile/spawn with a fixed program and an argument array (no shell), and allow-list values.
    metadata:
      cwe: "CWE-78"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: child_process.exec($CMD, ...)
              - pattern: child_process.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: 'child_process.spawn($CMD, $ARGS, {..., shell: true, ...})'
              - pattern: 'spawn($CMD, $ARGS, {..., shell: true, ...})'
          - focus-metavariable: $CMD

  - id: nervve.js.code-injection
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted input is executed as JavaScript (eval, Function, vm, setTimeout with a string). An attacker can run
      any code with the server's or the page's privileges. Parse data with JSON.parse instead.
    metadata:
      cwe: "CWE-95"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - pattern-either:
          - pattern: eval(...)
          - pattern: new Function(...)
          - pattern: Function(...)
          - pattern: vm.runInNewContext(...)
          - pattern: vm.runInThisContext(...)
          - pattern: vm.runInContext(...)
          - pattern: new vm.Script(...)
          - patterns:
              - pattern-either:
                  - pattern: setTimeout($CODE, ...)
                  - pattern: setInterval($CODE, ...)
              - focus-metavariable: $CODE

  - id: nervve.js.path-traversal
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      File path built from untrusted input. An attacker can read or overwrite files outside the intended folder
      with "../" sequences. Resolve the path with path.resolve and check it starts with the base directory.
    metadata:
      cwe: "CWE-22"
      owasp: "A01:2021 Broken Access Control"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fs.$FN($P, ...)
              - pattern: fsp.$FN($P, ...)
              - pattern: fs.promises.$FN($P, ...)
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
              - pattern: require($P)
          - metavariable-regex:
              metavariable: $FN
              regex: ^(readFile|readFileSync|writeFile|writeFileSync|appendFile|appendFileSync|createReadStream|createWriteStream|unlink|unlinkSync|rm|rmSync|readdir|readdirSync|open|openSync|stat)$
          - focus-metavariable: $P
      - patterns:
          - pattern-either:
              - pattern: $RES.sendFile($P, ...)
              - pattern: $RES.download($P, ...)
              - pattern: require($P)
          - pattern-not: '$RES.sendFile($P, {..., root: $ROOT, ...})'
          - focus-metavariable: $P

  - id: nervve.js.ssrf
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Server-side request to a URL taken from untrusted input (SSRF). An attacker can reach internal services and
      cloud metadata endpoints. Allow-list the destination host and protocol before making the request.
    metadata:
      cwe: "CWE-918"
      owasp: "A10:2021 Server-Side Request Forgery"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: fetch($URL, ...)
              - pattern: axios($URL, ...)
              - pattern: axios.$M($URL, ...)
              - pattern: http.get($URL, ...)
              - pattern: https.get($URL, ...)
              - pattern: http.request($URL, ...)
              - pattern: https.request($URL, ...)
              - pattern: got($URL, ...)
              - pattern: got.$M($URL, ...)
              - pattern: request($URL, ...)
              - pattern: needle.get($URL, ...)
          - focus-metavariable: $URL

  - id: nervve.js.open-redirect
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Redirect to a location taken from untrusted input. Attackers use it to send users to phishing pages that
      appear to come from this site. Redirect only to relative paths or an allow-list of hosts.
    metadata:
      cwe: "CWE-601"
      owasp: "A01:2021 Broken Access Control"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.redirect($LOC)
              - pattern: $RES.redirect($CODE, $LOC)
              - pattern: $CTX.redirect($LOC)
              - pattern: '$RES.writeHead($CODE, {..., Location: $LOC, ...})'
              - pattern: $RES.setHeader("Location", $LOC)
          - focus-metavariable: $LOC

  - id: nervve.js.reflected-xss
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Untrusted request data is written into an HTML response without escaping (reflected cross-site scripting).
      Render through a template engine that escapes by default, or escape the value before sending it.
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $RES.send($BODY)
              - pattern: $RES.write($BODY)
              - pattern: $RES.end($BODY)
          - focus-metavariable: $BODY
          - pattern-either:
              - pattern: '"$HTML" + $X'
              - pattern: $X + "$HTML"
              - pattern: '`$HTML`'
          - metavariable-regex:
              metavariable: $HTML
              regex: (?s).*<[a-zA-Z!/].*

  - id: nervve.js.dom-xss
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Data from the page URL, a message event or storage is written into the DOM as HTML (DOM-based cross-site
      scripting). Use textContent, or sanitise with DOMPurify before assigning HTML.
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources:
      - pattern-either:
          - pattern: location.hash
          - pattern: location.search
          - pattern: location.href
          - pattern: window.location.hash
          - pattern: window.location.search
          - pattern: window.location.href
          - pattern: document.URL
          - pattern: document.documentURI
          - pattern: document.referrer
          - pattern: document.cookie
          - pattern: window.name
          - pattern: new URLSearchParams(...).get(...)
          - pattern: $E.data
          - pattern: localStorage.getItem(...)
          - pattern: sessionStorage.getItem(...)
    pattern-sanitizers: *js_sanitizers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $EL.innerHTML = $V
              - pattern: $EL.outerHTML = $V
              - pattern: document.write($V)
              - pattern: document.writeln($V)
              - pattern: $EL.insertAdjacentHTML($POS, $V)
              - pattern: $($V)
              - pattern: $EL.html($V)
              - pattern: eval($V)
              - pattern: '<$TAG dangerouslySetInnerHTML={{__html: $V}} />'
          - focus-metavariable: $V

  - id: nervve.js.nosql-injection
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      A MongoDB query uses an object taken directly from the request. Attackers can send operators such as
      {"$ne": null} or {"$where": ...} to bypass checks. Cast fields to the expected type (String(...)) or
      validate the body with a schema.
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sanitizers:
      - pattern: String(...)
      - pattern: mongoSanitize(...)
      - pattern: sanitize(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $M.find($Q, ...)
              - pattern: $M.findOne($Q, ...)
              - pattern: $M.findOneAndUpdate($Q, ...)
              - pattern: $M.updateOne($Q, ...)
              - pattern: $M.deleteOne($Q, ...)
              - pattern: $M.deleteMany($Q, ...)
              - pattern: $M.countDocuments($Q, ...)
              - pattern: '$M.find({$where: $Q})'
          - focus-metavariable: $Q

  - id: nervve.js.insecure-deserialisation
    mode: taint
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Untrusted data is deserialised with a library that can execute code (node-serialize, serialize-to-js,
      js-yaml load with the full schema). Use JSON.parse, or yaml.load with the default safe schema.
    metadata:
      cwe: "CWE-502"
      owasp: "A08:2021 Software and Data Integrity Failures"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sinks:
      - pattern-either:
          - pattern: serialize.unserialize(...)
          - pattern: require("node-serialize").unserialize(...)
          - pattern: unserialize(...)
          - pattern: 'yaml.load($X, {..., schema: yaml.DEFAULT_FULL_SCHEMA, ...})'
          - pattern: yaml.loadAll(...)

  - id: nervve.js.prototype-pollution
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      An object is merged or assigned with keys taken from the request. Keys such as "__proto__" or "constructor"
      change the prototype of every object (prototype pollution), which can lead to privilege escalation or code
      execution. Reject those keys or use Object.create(null) / Map.
    metadata:
      cwe: "CWE-1321"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-sources: *js_sources
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: _.merge($T, $SRC, ...)
              - pattern: _.defaultsDeep($T, $SRC, ...)
              - pattern: merge($T, $SRC, ...)
              - pattern: deepmerge($T, $SRC, ...)
              - pattern: $OBJ[$K1][$K2] = $V
          - focus-metavariable: $SRC

  - id: nervve.js.tls-verification-disabled
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      TLS certificate verification is disabled, so anyone on the network path can impersonate the server. Remove
      rejectUnauthorized: false / NODE_TLS_REJECT_UNAUTHORIZED=0 and supply the CA certificate instead.
    metadata:
      cwe: "CWE-295"
      owasp: "A02:2021 Cryptographic Failures"
      confidence: high
      category: crypto
    pattern-either:
      - pattern: '{..., rejectUnauthorized: false, ...}'
      - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
      - pattern: process.env["NODE_TLS_REJECT_UNAUTHORIZED"] = "0"

  - id: nervve.js.jwt-unverified
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A JSON Web Token is decoded without verification, or verification accepts the "none" algorithm. Anyone can
      forge tokens. Use jwt.verify with the key and an explicit algorithms list.
    metadata:
      cwe: "CWE-347"
      owasp: "A02:2021 Cryptographic Failures"
      confidence: high
      category: crypto
    pattern-either:
      - pattern: 'jwt.verify($T, $K, {..., algorithms: [..., "none", ...], ...}, ...)'
      - patterns:
          - pattern: jwt.decode($T, ...)
          - pattern-inside: |
              function $F(...) { ... }
          - pattern-not-inside: |
              ...
              jwt.verify(...)
              ...

  - id: nervve.js.weak-crypto
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      Broken or weak cryptography (MD5/SHA-1 for security, DES, RC4 or ECB mode). Use SHA-256 or better for
      hashing, AES-GCM for encryption, and bcrypt/argon2/scrypt for passwords.
    metadata:
      cwe: "CWE-327"
      owasp: "A02:2021 Cryptographic Failures"
      confidence: medium
      category: crypto
    patterns:
      - pattern-either:
          - pattern: crypto.createCipheriv("$ALG", ...)
          - pattern: crypto.createCipher(...)
          - pattern: crypto.createHash("$ALG")
      - metavariable-regex:
          metavariable: $ALG
          regex: (?i)^(md5|sha1|des.*|rc4.*|aes-\d+-ecb|bf.*|blowfish.*)$

  - id: nervve.js.insecure-cookie
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      A session cookie is set without the Secure or HttpOnly flag, so it can be sent over plain HTTP or read by
      injected scripts. Set secure: true, httpOnly: true and sameSite.
    metadata:
      cwe: "CWE-614"
      owasp: "A05:2021 Security Misconfiguration"
      confidence: medium
      category: config
    pattern-either:
      - pattern: '$RES.cookie($N, $V, {..., httpOnly: false, ...})'
      - pattern: '$RES.cookie($N, $V, {..., secure: false, ...})'
      - pattern: 'session({..., cookie: {..., secure: false, ...}, ...})'

  - id: nervve.js.session-cookie-flags-missing
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      express-session is configured without a cookie that sets secure: true and httpOnly: true, so the session id
      is sent over plain HTTP and can be read by injected scripts. Set cookie: { secure: true, httpOnly: true,
      sameSite: "lax" }.
    metadata:
      cwe: "CWE-614"
      owasp: "A05:2021 Security Misconfiguration"
      confidence: medium
      category: config
    patterns:
      - pattern-either:
          - pattern: 'session({...})'
          - pattern: 'expressSession({...})'
          - pattern: 'cookieSession({...})'
      - pattern-not: 'session({..., cookie: {..., secure: true, ...}, ...})'
      - pattern-not: 'session({..., cookie: $C, ...})'
      - pattern-not: 'expressSession({..., cookie: {..., secure: true, ...}, ...})'
      - pattern-not: 'cookieSession({..., secure: true, ...})'

  - id: nervve.js.hardcoded-session-secret
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The session or token signing secret is a literal in the source, so anyone with the code can forge sessions
      or tokens. Load it from the environment or a secrets manager and rotate the current value.
    metadata:
      cwe: "CWE-798"
      owasp: "A07:2021 Identification and Authentication Failures"
      confidence: high
      category: secrets
    pattern-either:
      - pattern: 'session({..., secret: "$S", ...})'
      - pattern: 'expressSession({..., secret: "$S", ...})'
      - pattern: 'cookieParser("$S")'
      - pattern: jwt.sign($P, "$S", ...)
      - pattern: jsonwebtoken.sign($P, "$S", ...)
      - pattern: jwt.verify($T, "$S", ...)

  - id: nervve.js.template-autoescape-disabled
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      HTML auto-escaping is turned off for the template engine, so every value rendered into a page is a potential
      cross-site scripting flaw. Keep autoescape on and mark only vetted values as safe.
    metadata:
      cwe: "CWE-79"
      owasp: "A03:2021 Injection"
      confidence: high
      category: injection
    pattern-either:
      - pattern: '$X.setDefaults({..., autoescape: false, ...})'
      - pattern: '$X.configure($P, {..., autoescape: false, ...})'
      - pattern: '$X.compile($T, {..., noEscape: true, ...})'
      - pattern: 'new $E.Environment($L, {..., autoescape: false, ...})'
      - pattern: $SCE.trustAsHtml(...)
      - pattern: new Handlebars.SafeString(...)

  - id: nervve.js.nosql-where-injection
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      A MongoDB $where clause (server-side JavaScript) is built by string concatenation. If any part comes from a
      request, an attacker can run JavaScript in the database or bypass the filter. Use ordinary query operators
      and never $where with dynamic values.
    metadata:
      cwe: "CWE-943"
      owasp: "A03:2021 Injection"
      confidence: medium
      category: injection
    patterns:
      - pattern-either:
          - pattern: '{..., $where: $A + $B, ...}'
          - pattern: '{..., $where: `...${$X}...`, ...}'
          - pattern: '{..., "$where": $A + $B, ...}'
          - pattern: '$Q.$where($A + $B)'
      - pattern-not: '{..., $where: "..." + "...", ...}'

  - id: nervve.js.log-injection
    mode: taint
    languages: [javascript, typescript]
    severity: INFO
    message: >-
      Request data is written to the log unmodified. An attacker can forge log lines (newlines) or inject content
      into log viewers. Strip CR/LF or log structured fields.
    metadata:
      cwe: "CWE-117"
      owasp: "A09:2021 Security Logging and Monitoring Failures"
      confidence: medium
      category: logging
    pattern-sources: *js_sources
    pattern-sanitizers:
      - pattern-either:
          - pattern: JSON.stringify(...)
          - pattern: $X.replace(...)
          - pattern: parseInt(...)
          - pattern: Number(...)
    pattern-sinks:
      - pattern-either:
          - pattern: console.$LOG(...)
          - pattern: $LOGGER.info(...)
          - pattern: $LOGGER.warn(...)
          - pattern: $LOGGER.error(...)
          - pattern: $LOGGER.debug(...)

  - id: nervve.js.mass-assignment
    mode: taint
    languages: [javascript, typescript]
    severity: WARNING
    message: >-
      The whole request body is written to a database model, so a client can set fields it should not control
      (role, isAdmin, balance). Copy only the allowed fields.
    metadata:
      cwe: "CWE-915"
      owasp: "A08:2021 Software and Data Integrity Failures"
      confidence: medium
      category: validation
    pattern-sources:
      - pattern: $REQ.body
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: new $MODEL($B)
              - pattern: $MODEL.create($B)
              - pattern: $MODEL.insertOne($B)
              - pattern: '$MODEL.updateOne($F, {$set: $B})'
              - pattern: $MODEL.findByIdAndUpdate($ID, $B, ...)
              - pattern: Object.assign($DOC, $B)
          - metavariable-regex:
              metavariable: $MODEL
              regex: ^[A-Z]\w*$|.*(Model|Collection|collection|model|db|repo)$
          - focus-metavariable: $B
