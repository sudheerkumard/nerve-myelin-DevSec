# RAT Flea DevSec SAST rules for Python: web framework and platform hardening. Original work: not derived from the semgrep-rules
# registry.
rules:
  - id: nervve.python.archive-extraction
    languages: [python]
    severity: WARNING
    message: >-
      Every member of the archive is extracted without checking its path, so a crafted archive writes outside the
      target directory (zip slip). Use tarfile extractall(filter="data") or validate each member path.
    metadata: {cwe: "CWE-22", owasp: "A01:2021", confidence: medium, category: file}
    patterns:
      - pattern-either:
          - pattern: $T.extractall(...)
      - pattern-not: $T.extractall(..., filter="data", ...)
      - pattern-not: $T.extractall(..., filter='data', ...)
      - pattern-not: $T.extractall(..., members=$M, ...)
  - id: nervve.python.cors-any-origin-with-credentials
    languages: [python]
    severity: ERROR
    message: CORS allows every origin together with credentials, so any web site can make authenticated calls as the user.
    metadata: {cwe: "CWE-942", owasp: "A05:2021", confidence: high, category: configuration}
    pattern-either:
      - pattern: CORS($APP, ..., origins="*", ..., supports_credentials=True, ...)
      - pattern: CORS($APP, ..., supports_credentials=True, ..., origins="*", ...)
      - pattern: $A.add_middleware(CORSMiddleware, ..., allow_origins=["*"], ..., allow_credentials=True, ...)
      - pattern: $A.add_middleware(CORSMiddleware, ..., allow_credentials=True, ..., allow_origins=["*"], ...)
  - id: nervve.python.insecure-session-cookie
    languages: [python]
    severity: WARNING
    message: Session or CSRF cookies are sent over plain HTTP or readable by scripts. Set Secure and HttpOnly.
    metadata: {cwe: "CWE-614", owasp: "A05:2021", confidence: high, category: configuration}
    pattern-either:
      - pattern: SESSION_COOKIE_SECURE = False
      - pattern: CSRF_COOKIE_SECURE = False
      - pattern: SESSION_COOKIE_HTTPONLY = False
      - pattern: $APP.config["SESSION_COOKIE_SECURE"] = False
      - pattern: $R.set_cookie(..., secure=False, ...)
      - pattern: $R.set_cookie(..., httponly=False, ...)
  - id: nervve.python.debug-enabled
    languages: [python]
    severity: WARNING
    message: Debug mode exposes an interactive debugger or detailed errors (code execution, secrets). Disable it in production.
    metadata: {cwe: "CWE-489", owasp: "A05:2021", confidence: medium, category: configuration}
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: DEBUG = True
      - pattern: uvicorn.run(..., reload=True, ..., host="0.0.0.0", ...)
  - id: nervve.python.csrf-exempt
    languages: [python]
    severity: WARNING
    message: CSRF protection is switched off for this view; a malicious page can submit the request with the user's session.
    metadata: {cwe: "CWE-352", owasp: "A01:2021", confidence: medium, category: configuration}
    pattern-either:
      - pattern: |
          @csrf_exempt
          def $F(...): ...
      - pattern: WTF_CSRF_ENABLED = False
      - pattern: $APP.config["WTF_CSRF_ENABLED"] = False
  - id: nervve.python.weak-random-token
    languages: [python]
    severity: WARNING
    message: The random module is predictable; use secrets.token_urlsafe / secrets.choice for tokens, passwords and keys.
    metadata: {cwe: "CWE-338", owasp: "A02:2021", confidence: medium, category: crypto}
    patterns:
      - pattern-inside: |
          def $F(...):
              ...
      - metavariable-regex: {metavariable: $F, regex: '(?i).*(token|password|passwd|secret|otp|nonce|salt|reset|invite|api_?key|session).*'}
      - pattern-either:
          - pattern: random.random(...)
          - pattern: random.randint(...)
          - pattern: random.choice(...)
          - pattern: random.choices(...)
          - pattern: random.getrandbits(...)
          - pattern: random.sample(...)
  - id: nervve.python.insecure-tls-version
    languages: [python]
    severity: WARNING
    message: TLS 1.0/1.1 or SSLv3 is allowed. Use ssl.create_default_context() and minimum_version = TLSVersion.TLSv1_2.
    metadata: {cwe: "CWE-326", owasp: "A02:2021", confidence: high, category: crypto}
    pattern-either:
      - pattern: ssl.PROTOCOL_TLSv1
      - pattern: ssl.PROTOCOL_TLSv1_1
      - pattern: ssl.PROTOCOL_SSLv3
      - pattern: ssl.PROTOCOL_SSLv23
      - pattern: $C.minimum_version = ssl.TLSVersion.TLSv1
      - pattern: $C.minimum_version = ssl.TLSVersion.TLSv1_1
  - id: nervve.python.bind-all-interfaces
    languages: [python]
    severity: INFO
    message: The server listens on every network interface. Bind to the interface it needs (or put it behind a proxy).
    metadata: {cwe: "CWE-1327", owasp: "A05:2021", confidence: low, category: configuration}
    pattern-either:
      - pattern: $S.bind(("0.0.0.0", $P))
      - pattern: $S.bind(("", $P))
