apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: payments
spec:
  sourceRepos: ["*"]
  destinations:
    - namespace: "*"
      server: "*"
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payments-web
spec:
  project: payments
  source:
    repoURL: https://github.com/acme/payments-web.git
    targetRevision: main
    path: chart
  destination:
    server: https://kubernetes.default.svc
    namespace: payments
  syncPolicy:
    automated: {prune: true, selfHeal: true}
