.c::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;border-radius:14px 14px 0 0;background:var(--k)}
.c:hover,.c:focus-visible{transform:translateY(-2px);box-shadow:0 10px 28px rgba(0,0,0,.45),0 0 0 1px var(--k)}
.c .h{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px}
.c .i{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:color-mix(in srgb,var(--k) 18%,transparent);color:var(--k);flex:none}
.c .i svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.c .d{color:var(--tx2);font-size:12px;margin-top:5px}
.c.sel{box-shadow:0 0 0 2px var(--k),0 14px 34px rgba(0,0,0,.5)}

.c .num{position:absolute;top:-9px;right:-9px;width:24px;height:24px;border-radius:50%;background:var(--k);color:#06101E;font-weight:800;font-size:12px;display:none;place-items:center;box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 35%,transparent)}
.c.hl .num.show{display:grid}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.chip{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--teal) 45%,transparent);background:color-mix(in srgb,var(--teal) 12%,transparent);color:var(--tx)}
aside{background:rgba(17,26,46,.85);border:1px solid var(--ln);border-radius:20px;padding:20px;position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto}
aside .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--teal)}
aside h2{margin:4px 0 6px;font-size:20px}
aside p{color:var(--tx2);margin:6px 0 12px}
aside h3{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--tx3);margin:16px 0 6px}
aside ul{margin:0;padding-left:18px;color:var(--tx)}aside li{margin:3px 0}
aside a{color:#7DD3FC}
.caption{position:sticky;bottom:0;margin-top:12px;background:rgba(11,18,32,.92);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;min-height:56px}
.caption .n{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--teal);color:#04201C;flex:none}
.prog{height:4px;background:var(--p2);border-radius:4px;overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;width:0;background:var(--teal);transition:width .4s}
.hint{color:var(--tx3);font-size:12px}
@media (prefers-reduced-motion:reduce){.c{transition:none}}
</style>

  const c = C[id];
  document.querySelectorAll(".c").forEach(e => e.classList.toggle("sel", e.dataset.id === id));
  const li = a => a.map(x => `<li>${x}</li>`).join("");
  $("#panel").innerHTML = `<div class="k" style="color:var(--${c.k})">${{clients:"Client / sensor",edge:"Edge",core:"Control plane",eng:"Engines",int:"Integration",data:"Data"}[c.band]}</div>
    <h2>${c.t}</h2><p>${c.about}</p><h3>Receives</h3><ul>${li(c.in)}</ul><h3>Sends</h3><ul>${li(c.out)}</ul><h3>Protected by</h3><ul>${li(c.ctl)}</ul>
    <h3>Read more</h3><p><a href="${D + c.doc[1]}" target="_top">${c.doc[0]} →</a></p>`;
}
let view = "Data flow", step = -1, timer = null;
const tabs = $("#tabs");
Object.keys(VIEWS).forEach(v => { const b = document.createElement("button"); b.textContent = v; b.setAttribute("role", "tab"); b.onclick = () => { view = v; reset(); render(); }; tabs.appendChild(b); });
function render() { [...tabs.children].forEach(b => b.classList.toggle("on", b.textContent === view)); }
function go(i) {
  const seq = VIEWS[view], n = seq.length / 2;
  step = i;
  const ids = seq[i * 2], txt = seq[i * 2 + 1];
  stage.classList.add("focus");
  document.querySelectorAll(".c").forEach(e => { const on = ids.includes(e.dataset.id); e.classList.toggle("hl", on); const nb = e.querySelector(".num"); nb.textContent = i + 1; nb.classList.toggle("show", on); });
  $("#capn").textContent = i + 1; $("#capt").innerHTML = txt; $("#bar").style.width = ((i + 1) / n * 100) + "%";
  show(ids[0]);
}
function reset() { clearInterval(timer); timer = null; step = -1; stage.classList.remove("focus"); document.querySelectorAll(".c").forEach(e => e.classList.remove("hl"));
  $("#play").textContent = "▶ Play"; $("#capn").textContent = "i"; $("#capt").innerHTML = `<b>${view}</b>: press <b>Play</b> or use ← → to step through. Click a component for details.`; $("#bar").style.width = "0"; }
$("#play").onclick = () => {
  if (timer) { clearInterval(timer); timer = null; $("#play").textContent = "▶ Play"; return; }
  const n = VIEWS[view].length / 2;
  go(step + 1 >= n ? 0 : step + 1);
  $("#play").textContent = "❚❚ Pause";
  timer = setInterval(() => { const m = VIEWS[view].length / 2; if (step + 1 >= m) { clearInterval(timer); timer = null; $("#play").textContent = "↻ Replay"; return; } go(step + 1); }, 3600);
};
$("#reset").onclick = reset;
document.addEventListener("keydown", e => { const n = VIEWS[view].length / 2; if (e.key === "ArrowRight") go(Math.min(n - 1, step + 1)); if (e.key === "ArrowLeft") go(Math.max(0, step - 1)); });
render(); reset(); show("ingest");
</script>
</body>
