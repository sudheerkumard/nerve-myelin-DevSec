<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 760" width="1600" height="760" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif"><title id="t">Finding lifecycle</title><desc id="d">States a finding moves through and what moves it.</desc><style>.flow{stroke-dasharray:7 9;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-32}}.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><defs><marker id="ar22C55E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker><marker id="ar3B82F6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B82F6"/></marker><marker id="ar64748B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748B"/></marker><marker id="ar8B5CF6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B5CF6"/></marker><marker id="arEF4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker><marker id="arF59E0B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter><radialGradient id="bgg" cx="20%" cy="0%" r="110%"><stop offset="0" stop-color="#14304A"/><stop offset=".55" stop-color="#0B1220"/><stop offset="1" stop-color="#090E1A"/></radialGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A3F"/><stop offset="1" stop-color="#151C3A"/></linearGradient></defs><rect width="1600" height="760" rx="22" fill="url(#bgg)"/><path d="M402 270 L634 270" fill="none" stroke="#3B82F6" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M402 270 L634 270" fill="none" stroke="#3B82F6" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#ar3B82F6)"/><path d="M962 250 L1194 250" fill="none" stroke="#22C55E" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M962 250 L1194 250" fill="none" stroke="#22C55E" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#ar22C55E)"/><path d="M1198 292 L966 292" fill="none" stroke="#EF4444" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M1198 292 L966 292" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#arEF4444)"/><path d="M830 334 L830 452" fill="none" stroke="#F59E0B" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M830 334 L830 452" fill="none" stroke="#F59E0B" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#arF59E0B)"/><path d="M770 456 L770 338" fill="none" stroke="#EF4444" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M770 456 L770 338" fill="none" stroke="#EF4444" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#arEF4444)"/><path d="M680 334 L300 454" fill="none" stroke="#64748B" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M680 334 L300 454" fill="none" stroke="#64748B" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#ar64748B)"/><path d="M920 334 L1300 454" fill="none" stroke="#8B5CF6" stroke-opacity=".28" stroke-width="6.2" stroke-linecap="round"/><path d="M920 334 L1300 454" fill="none" stroke="#8B5CF6" stroke-width="2.2" stroke-linecap="round" class="flow" marker-end="url(#ar8B5CF6)"/><text x="48" y="52" font-size="12" fill="#14B8A6" font-weight="700" text-anchor="start" letter-spacing="2.2"><tspan x="48" dy="0.0">LIFECYCLE</tspan></text><text x="48" y="86" font-size="28" fill="#EAF0FA" font-weight="800" text-anchor="start"><tspan x="48" dy="0.0">The life of a finding</tspan></text><text x="48" y="114" font-size="14.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">Scans open and close findings automatically; people decide on exceptions; nothing is closed by an outside document alone.</tspan></text><text x="1552" y="52" font-size="12" fill="#6F7E9C" font-weight="700" text-anchor="end" letter-spacing="2.2"><tspan x="1552" dy="0.0">NERVVE DEVSECOPS</tspan></text><rect x="80" y="208" width="320" height="124" rx="14" fill="#111A2E" stroke="#3B82F6" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="80" y="208" width="320" height="4" rx="2" fill="#3B82F6"/><text x="96" y="238" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="96" dy="0.0">New in a scan</tspan></text><text x="96" y="260.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="96" dy="0.0">fingerprint not seen before</tspan></text><rect x="640" y="208" width="320" height="124" rx="14" fill="#111A2E" stroke="#EF4444" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="640" y="208" width="320" height="4" rx="2" fill="#EF4444"/><text x="656" y="238" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="656" dy="0.0">Open</tspan></text><text x="656" y="260.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="656" dy="0.0">reported by the latest scan of the engine</tspan><tspan x="656" dy="15.6">that found it</tspan></text><rect x="1200" y="208" width="320" height="124" rx="14" fill="#111A2E" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="1200" y="208" width="320" height="4" rx="2" fill="#22C55E"/><text x="1216" y="238" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1216" dy="0.0">Fixed</tspan></text><text x="1216" y="260.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1216" dy="0.0">the engine ran again and no longer reports</tspan><tspan x="1216" dy="15.6">it</tspan></text><rect x="80" y="458" width="320" height="124" rx="14" fill="#111A2E" stroke="#64748B" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="80" y="458" width="320" height="4" rx="2" fill="#64748B"/><text x="96" y="488" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="96" dy="0.0">False positive</tspan></text><text x="96" y="510.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="96" dy="0.0">with the analyst&#x27;s reason; audited</tspan></text><rect x="640" y="458" width="320" height="124" rx="14" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="640" y="458" width="320" height="4" rx="2" fill="#F59E0B"/><text x="656" y="488" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="656" dy="0.0">Risk accepted</tspan></text><text x="656" y="510.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="656" dy="0.0">time-boxed, approved by a second person</tspan></text><rect x="1200" y="458" width="320" height="124" rx="14" fill="#111A2E" stroke="#8B5CF6" stroke-opacity=".55" stroke-width="1.4" filter="url(#sh)"/><rect x="1200" y="458" width="320" height="4" rx="2" fill="#8B5CF6"/><text x="1216" y="488" font-size="17" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1216" dy="0.0">Not affected (VEX)</tspan></text><text x="1216" y="510.1" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1216" dy="0.0">only after an analyst applies the statement</tspan></text><rect x="80" y="630" width="1440" height="64" rx="14" fill="#111A2E" stroke="#14B8A6" stroke-opacity=".55" stroke-width="1.4"/><rect x="80" y="630" width="1440" height="4" rx="2" fill="#14B8A6"/><text x="104" y="668" font-size="14" fill="#EAF0FA" font-weight="600" text-anchor="start"><tspan x="104" dy="0.0">Every transition is written to the hash-chained audit log with actor and reason, and synced to the linked ticket.</tspan></text><rect x="432" y="230" width="176" height="22" rx="7" fill="#0B1220" stroke="#3B82F6" stroke-opacity=".55"/><text x="520.0" y="244" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="520.0" dy="0.0">triage queue, ticket, SLA</tspan></text><rect x="1031" y="210" width="99" height="22" rx="7" fill="#0B1220" stroke="#22C55E" stroke-opacity=".55"/><text x="1080.0" y="224" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="1080.0" dy="0.0">re-scan: gone</tspan></text><rect x="1002" y="308" width="156" height="22" rx="7" fill="#0B1220" stroke="#EF4444" stroke-opacity=".55"/><text x="1080.0" y="322" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="1080.0" dy="0.0">regression: back again</tspan></text><rect x="855" y="373" width="131" height="22" rx="7" fill="#0B1220" stroke="#F59E0B" stroke-opacity=".55"/><text x="920" y="387.0" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="920" dy="0.0">exception approved</tspan></text><rect x="615" y="373" width="131" height="22" rx="7" fill="#0B1220" stroke="#EF4444" stroke-opacity=".55"/><text x="680" y="387.0" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="680" dy="0.0">expiry date passes</tspan></text><rect x="419" y="401" width="163" height="22" rx="7" fill="#0B1220" stroke="#64748B" stroke-opacity=".55"/><text x="500.0" y="415.0" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="500.0" dy="0.0">analyst: false positive</tspan></text><rect x="1022" y="401" width="156" height="22" rx="7" fill="#0B1220" stroke="#8B5CF6" stroke-opacity=".55"/><text x="1100.0" y="415.0" font-size="11" fill="#EAF0FA" font-weight="500" text-anchor="middle"><tspan x="1100.0" dy="0.0">VEX reviewed + applied</tspan></text></svg>