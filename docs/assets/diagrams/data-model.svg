65 640 L665 786" fill="none" stroke="#F59E0B" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arF59E0B)"/><path d="M1475 418 L1475 526" fill="none" stroke="#06B6D4" stroke-opacity=".28" stroke-width="5.6" stroke-linecap="round"/><path d="M1475 418 L1475 526" fill="none" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar06B6D4)"/><path d="M1326 590 L812 520" fill="none" stroke="#06B6D4" stroke-opacity=".28" stroke-width="5.6" stroke-linecap="round"/><path d="M1326 590 L812 520" fill="none" stroke="#06B6D4" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar06B6D4)"/><path d="M1326 780 L812 580" fill="none" stroke="#EC4899" stroke-opacity=".28" stroke-width="5.6" stroke-linecap="round"/><path d="M1326 780 L812 580" fill="none" stroke="#EC4899" stroke-width="1.6" stroke-linecap="round" marker-end="url(#arEC4899)"/><path d="M1010 330 L812 480" fill="none" stroke="#22C55E" stroke-opacity=".28" stroke-width="5.6" stroke-linecap="round"/><path d="M1010 330 L812 480" fill="none" stroke="#22C55E" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar22C55E)"/><path d="M382 790 L516 610" fill="none" stroke="#8B5CF6" stroke-opacity=".28" stroke-width="5.6" stroke-linecap="round"/><path d="M382 790 L516 610" fill="none" stroke="#8B5CF6" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar8B5CF6)"/><text x="48" y="52" font-size="12" fill="#14B8A6" font-weight="700" text-anchor="start" letter-spacing="2.2"><tspan x="48" dy="0.0">DATA MODEL</tspan></text><text x="48" y="86" font-size="28" fill="#EAF0FA" font-weight="800" text-anchor="start"><tspan x="48" dy="0.0">What NERVE Myelin stores</tspan></text><text x="48" y="114" font-size="14.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">Every table below carries tenant_id and is protected by PostgreSQL forced row-level security.</tspan></text><text x="1632" y="52" font-size="12" fill="#6F7E9C" font-weight="700" text-anchor="end" letter-spacing="2.2"><tspan x="1632" dy="0.0">NERVE MYELIN</tspan></text><rect x="720" y="150" width="290" height="92" rx="12" fill="#111A2E" stroke="#14B8A6" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="720" y="150" width="290" height="36" rx="12" fill="#14B8A6" fill-opacity=".22"/><text x="736" y="174" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="736" dy="0.0">Tenant</tspan></text><text x="736" y="208" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="736" dy="0.0">id · slug · name</tspan></text><text x="736" y="228" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="736" dy="0.0">plan · region · settings</tspan></text><rect x="90" y="330" width="290" height="92" rx="12" fill="#111A2E" stroke="#3B82F6" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="90" y="330" width="290" height="36" rx="12" fill="#3B82F6" fill-opacity=".22"/><text x="106" y="354" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="106" dy="0.0">Repository</tspan></text><text x="106" y="388" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">name · business unit</tspan></text><text x="106" y="408" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">criticality · project</tspan></text><rect x="90" y="530" width="290" height="92" rx="12" fill="#111A2E" stroke="#3B82F6" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="90" y="530" width="290" height="36" rx="12" fill="#3B82F6" fill-opacity=".22"/><text x="106" y="554" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="106" dy="0.0">Scan</tspan></text><text x="106" y="588" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">repo · commit · decision</tspan></text><text x="106" y="608" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">engines that ran · SBOM</tspan></text><rect x="520" y="450" width="290" height="152" rx="12" fill="#111A2E" stroke="#EF4444" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="520" y="450" width="290" height="36" rx="12" fill="#EF4444" fill-opacity=".22"/><text x="536" y="474" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="536" dy="0.0">Finding</tspan></text><text x="536" y="508" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">fingerprint (unique)</tspan></text><text x="536" y="528" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">engine · rule · severity</tspan></text><text x="536" y="548" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">risk score · priority · SLA</tspan></text><text x="536" y="568" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">status · triage · ticket</tspan></text><text x="536" y="588" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">data: location, evidence, SSVC</tspan></text><rect x="90" y="730" width="290" height="112" rx="12" fill="#111A2E" stroke="#8B5CF6" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="90" y="730" width="290" height="36" rx="12" fill="#8B5CF6" fill-opacity=".22"/><text x="106" y="754" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="106" dy="0.0">Policy</tspan></text><text x="106" y="788" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">versions (immutable)</tspan></text><text x="106" y="808" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">approvals · bindings</tspan></text><text x="106" y="828" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="106" dy="0.0">exceptions (time-boxed)</tspan></text><rect x="520" y="790" width="290" height="92" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="520" y="790" width="290" height="36" rx="12" fill="#F59E0B" fill-opacity=".22"/><text x="536" y="814" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="536" dy="0.0">Audit event</tspan></text><text x="536" y="848" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">actor · event · detail</tspan></text><text x="536" y="868" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="536" dy="0.0">prev_hash → hash</tspan></text><rect x="950" y="790" width="290" height="92" rx="12" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="950" y="790" width="290" height="36" rx="12" fill="#F59E0B" fill-opacity=".22"/><text x="966" y="814" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="966" dy="0.0">Evidence</tspan></text><text x="966" y="848" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="966" dy="0.0">sha256 · storage URI</tspan></text><text x="966" y="868" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="966" dy="0.0">reviews · retention</tspan></text><rect x="1330" y="330" width="290" height="92" rx="12" fill="#111A2E" stroke="#06B6D4" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="1330" y="330" width="290" height="36" rx="12" fill="#06B6D4" fill-opacity=".22"/><text x="1346" y="354" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1346" dy="0.0">Cloud account</tspan></text><text x="1346" y="388" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">provider · scope</tspan></text><text x="1346" y="408" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">credential reference</tspan></text><rect x="1330" y="530" width="290" height="92" rx="12" fill="#111A2E" stroke="#06B6D4" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="1330" y="530" width="290" height="36" rx="12" fill="#06B6D4" fill-opacity=".22"/><text x="1346" y="554" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1346" dy="0.0">Cloud inventory</tspan></text><text x="1346" y="588" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">key (account / cluster)</tspan></text><text x="1346" y="608" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">resources · identities · grants</tspan></text><rect x="1330" y="730" width="290" height="92" rx="12" fill="#111A2E" stroke="#EC4899" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="1330" y="730" width="290" height="36" rx="12" fill="#EC4899" fill-opacity=".22"/><text x="1346" y="754" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1346" dy="0.0">Runtime event</tspan></text><text x="1346" y="788" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">cluster · workload · rule</tspan></text><text x="1346" y="808" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1346" dy="0.0">severity · tactics · time</tspan></text><rect x="950" y="330" width="290" height="92" rx="12" fill="#111A2E" stroke="#22C55E" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="950" y="330" width="290" height="36" rx="12" fill="#22C55E" fill-opacity=".22"/><text x="966" y="354" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="966" dy="0.0">Integrations</tspan></text><text x="966" y="388" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="966" dy="0.0">repo sources · ticketing</tspan></text><text x="966" y="408" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="966" dy="0.0">connectors · DAST targets</tspan></text><rect x="1080" y="150" width="290" height="92" rx="12" fill="#111A2E" stroke="#64748B" stroke-opacity=".7" stroke-width="1.4" filter="url(#sh)"/><rect x="1080" y="150" width="290" height="36" rx="12" fill="#64748B" fill-opacity=".22"/><text x="1096" y="174" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1096" dy="0.0">Users &amp; API keys</tspan></text><text x="1096" y="208" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1096" dy="0.0">identity binding · roles</tspan></text><text x="1096" y="228" font-size="12.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1096" dy="0.0">hashed, expiring keys</tspan></text><text x="48" y="998" font-size="11.5" fill="#6F7E9C" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">Credentials are never stored in these tables: they live in the vault and are referenced by path.</tspan></text><text x="1632" y="998" font-size="11.5" fill="#6F7E9C" font-weight="400" text-anchor="end"><tspan x="1632" dy="0.0">© 2026 Sudheer Kumar · NERVE Myelin</tspan></text></svg>