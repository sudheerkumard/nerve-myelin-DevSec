<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1020" width="1680" height="1020" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif"><title id="t">Data model</title><desc id="d">Main entities, their key fields and relationships. Every entity belongs to one tenant.</desc><style>.flow{stroke-dasharray:7 9;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-32}}.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><defs><marker id="ar06B6D4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#06B6D4"/></marker><marker id="ar14B8A6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#14B8A6"/></marker><marker id="ar22C55E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22C55E"/></marker><marker id="ar3B82F6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3B82F6"/></marker><marker id="ar8B5CF6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8B5CF6"/></marker><marker id="arEC4899" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EC4899"/></marker><marker id="arEF4444" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#EF4444"/></marker><marker id="arF59E0B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#F59E0B"/></marker><filter id