<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" width="1600" height="720" role="img" aria-labelledby="t d" font-family="Inter, 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif"><title id="t">Myelin Risk Score</title><desc id="d">Components of the risk score and the priority bands they produce.</desc><style>.flow{stroke-dasharray:7 9;animation:fl 1.1s linear infinite}@keyframes fl{to{stroke-dashoffset:-32}}.pulse{animation:pu 2.4s ease-in-out infinite}@keyframes pu{50%{opacity:.45}}@media (prefers-reduced-motion:reduce){.flow,.pulse{animation:none}}</style><defs><filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter><radialGradient id="bgg" cx="20%" cy="0%" r="110%"><stop offset="0" stop-color="#14304A"/><stop offset=".55" stop-color="#0B1220"/><stop offset="1" stop-color="#090E1A"/></radialGradient><linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F2A3F"/><stop offset="1" stop-color="#151C3A"/></linearGradient></defs><rect width="1600" height="720" rx="22" fill="url(#bgg)"/><text x="48" y="52" font-size="12" fill="#14B8A6" font-weight="700" text-anchor="start" letter-spacing="2.2"><tspan x="48" dy="0.0">PRIORITISATION</tspan></text><text x="48" y="86" font-size="28" fill="#EAF0FA" font-weight="800" text-anchor="start"><tspan x="48" dy="0.0">What the Myelin Risk Score is made of</tspan></text><text x="48" y="114" font-size="14.5" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">Points add up to at most 100, then business criticality weights the result. The score sets the priority and the fix-by date.</tspan></text><text x="1552" y="52" font-size="12" fill="#6F7E9C" font-weight="700" text-anchor="end" letter-spacing="2.2"><tspan x="1552" dy="0.0">NERVE MYELIN</tspan></text><text x="48" y="222" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Impact</tspan></text><text x="248" y="222" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">CVSS × 4</tspan></text><rect x="468" y="206" width="144" height="26" rx="7" fill="#3B82F6"/><text x="620.0" y="225" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="620.0" dy="0.0">+40</tspan></text><text x="48" y="268" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Exploit likelihood</tspan></text><text x="248" y="268" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">EPSS × 25</tspan></text><rect x="468" y="252" width="90" height="26" rx="7" fill="#8B5CF6"/><text x="566.0" y="271" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="566.0" dy="0.0">+25</tspan></text><text x="48" y="314" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Known exploited</tspan></text><text x="248" y="314" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">CISA KEV</tspan></text><rect x="468" y="298" width="54" height="26" rx="7" fill="#EF4444"/><text x="530.0" y="317" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="530.0" dy="0.0">+15</tspan></text><text x="48" y="360" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Exposure</tspan></text><text x="248" y="360" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">internet / internal</tspan></text><rect x="468" y="344" width="36" height="26" rx="7" fill="#F59E0B"/><text x="512.0" y="363" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="512.0" dy="0.0">+10</tspan></text><text x="48" y="406" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Reachable</tspan></text><text x="248" y="406" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">first-party code path</tspan></text><rect x="468" y="390" width="36" height="26" rx="7" fill="#14B8A6"/><text x="512.0" y="409" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="512.0" dy="0.0">+10</tspan></text><text x="48" y="452" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Live secret</tspan></text><text x="248" y="452" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">provider confirmed</tspan></text><rect x="468" y="436" width="90" height="26" rx="7" fill="#F97316"/><text x="566.0" y="455" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="566.0" dy="0.0">+25</tspan></text><text x="48" y="498" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Malicious release</tspan></text><text x="248" y="498" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">indicator / OSV MAL</tspan></text><rect x="468" y="482" width="108" height="26" rx="7" fill="#EC4899"/><text x="584.0" y="501" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="584.0" dy="0.0">+30</tspan></text><text x="48" y="544" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Runtime attack</tspan></text><text x="248" y="544" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">critical / high detection</tspan></text><rect x="468" y="528" width="54" height="26" rx="7" fill="#EC4899"/><text x="530.0" y="547" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="530.0" dy="0.0">+15</tspan></text><text x="48" y="590" font-size="14" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="48" dy="0.0">Attack path</tspan></text><text x="248" y="590" font-size="12" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="248" dy="0.0">exposure + weakness + impact</tspan></text><rect x="468" y="574" width="72" height="26" rx="7" fill="#EF4444"/><text x="548.0" y="593" font-size="13" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="548.0" dy="0.0">+20</tspan></text><text x="48" y="636" font-size="13" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">× 0.45 when the vulnerable code is proven unreachable · × (0.8 + 0.2 × criticality) for the asset</tspan></text><rect x="1060" y="200" width="492" height="88" rx="14" fill="#111A2E" stroke="#EF4444" stroke-opacity=".55" stroke-width="1.4"/><rect x="1060" y="200" width="492" height="4" rx="2" fill="#EF4444"/><text x="1086" y="256" font-size="34" fill="#EF4444" font-weight="800" text-anchor="start"><tspan x="1086" dy="0.0">P0</tspan></text><text x="1170" y="240" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1170" dy="0.0">score 80–100</tspan></text><text x="1170" y="264" font-size="13" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1170" dy="0.0">fix within 2 days</tspan></text><rect x="1060" y="304" width="492" height="88" rx="14" fill="#111A2E" stroke="#F97316" stroke-opacity=".55" stroke-width="1.4"/><rect x="1060" y="304" width="492" height="4" rx="2" fill="#F97316"/><text x="1086" y="360" font-size="34" fill="#F97316" font-weight="800" text-anchor="start"><tspan x="1086" dy="0.0">P1</tspan></text><text x="1170" y="344" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1170" dy="0.0">score 60–79</tspan></text><text x="1170" y="368" font-size="13" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1170" dy="0.0">fix within 7 days</tspan></text><rect x="1060" y="408" width="492" height="88" rx="14" fill="#111A2E" stroke="#F59E0B" stroke-opacity=".55" stroke-width="1.4"/><rect x="1060" y="408" width="492" height="4" rx="2" fill="#F59E0B"/><text x="1086" y="464" font-size="34" fill="#F59E0B" font-weight="800" text-anchor="start"><tspan x="1086" dy="0.0">P2</tspan></text><text x="1170" y="448" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1170" dy="0.0">score 35–59</tspan></text><text x="1170" y="472" font-size="13" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1170" dy="0.0">fix within 30 days</tspan></text><rect x="1060" y="512" width="492" height="88" rx="14" fill="#111A2E" stroke="#22C55E" stroke-opacity=".55" stroke-width="1.4"/><rect x="1060" y="512" width="492" height="4" rx="2" fill="#22C55E"/><text x="1086" y="568" font-size="34" fill="#22C55E" font-weight="800" text-anchor="start"><tspan x="1086" dy="0.0">P3</tspan></text><text x="1170" y="552" font-size="15" fill="#EAF0FA" font-weight="700" text-anchor="start"><tspan x="1170" dy="0.0">score 0–34</tspan></text><text x="1170" y="576" font-size="13" fill="#A9B6CF" font-weight="400" text-anchor="start"><tspan x="1170" dy="0.0">fix within 90 days</tspan></text><text x="48" y="698" font-size="11.5" fill="#6F7E9C" font-weight="400" text-anchor="start"><tspan x="48" dy="0.0">Every component is shown in the finding drawer, so an analyst can see and challenge the score.</tspan></text><text x="1552" y="698" font-size="11.5" fill="#6F7E9C" font-weight="400" text-anchor="end"><tspan x="1552" dy="0.0">© 2026 Sudheer Kumar · NERVE Myelin</tspan></text></svg>