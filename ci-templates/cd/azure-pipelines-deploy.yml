# RAT Flea DevSec — CD gate for Azure Pipelines. Approvals and checks live on the 'production' environment.
# MYELIN_CLI_PACKAGE: the RAT Flea DevSec CLI to install, e.g.
# git+https://github.com/sudheerkumard/nervve-devsecops@v1.9.0 or a wheel on your internal package index
stages:
  - stage: deploy_production
    jobs:
      - deployment: deploy
        environment: production
        pool: { vmImage: ubuntu-latest }
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    pip install "$(MYELIN_CLI_PACKAGE)"
                    myelin gate --repo "$(Build.Repository.Name)" --commit "$(Build.SourceVersion)" --environment production
                  displayName: RAT Flea DevSec deployment gate
                  env:
                    MYELIN_SERVER: $(MYELIN_SERVER)
                    MYELIN_API_KEY: $(MYELIN_API_KEY)     # secret variable from a variable group linked to Key Vault
                - task: HelmDeploy@0
                  inputs:
                    command: upgrade
                    chartType: FilePath
                    chartPath: chart
                    releaseName: app
                    namespace: production
