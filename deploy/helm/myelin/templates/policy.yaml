{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myelin.name" . }}-default-deny
  labels: {{- include "myelin.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "myelin.name" . }}-api
  labels: {{- include "myelin.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }} } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.monitoringNamespace }} } }
      ports: [{ port: 8080, protocol: TCP }]
  egress:
    - to: [{ namespaceSelector: {}, podSelector: { matchLabels: { k8s-app: kube-dns } } }]
      ports: [{ port: 53, protocol: UDP }, { port: 53, protocol: TCP }]
    - to: [{ ipBlock: { cidr: {{ .Values.networkPolicy.databaseCidr }} } }]
      ports: [{ port: 5432, protocol: TCP }]
    - to:
      {{- range .Values.networkPolicy.egressHttpsCidrs }}
        - ipBlock: { cidr: {{ . }} }
      {{- end }}
      ports: [{ port: 443, protocol: TCP }]
    {{- if .Values.dast.zap.enabled }}
    - to: [{ podSelector: { matchLabels: { app.kubernetes.io/name: {{ include "myelin.name" . }}-zap } } }]
      ports: [{ port: 8090, protocol: TCP }]
    {{- end }}
{{- end }}
{{- if .Values.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "myelin.name" . }}-api
  labels: {{- include "myelin.labels" . | nindent 4 }}
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "myelin.name" . }}-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPU }} } }
{{- end }}
{{- if .Values.podDisruptionBudget.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "myelin.name" . }}-api
  labels: {{- include "myelin.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels: {{- include "myelin.selector" . | nindent 6 }}
{{- end }}
