{{/* Copyright (c) 2026 Sudheer Kumar. SPDX-License-Identifier: AGPL-3.0-only.
     Schema migrations run after ExternalSecret resources are submitted; API readiness stays false until the schema is current. The job uses the
     owner connection; the API pods only ever receive the least-privilege myelin_app connection. */}}
{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "myelin.name" . }}-migrate-{{ .Release.Revision }}
  labels: {{- include "myelin.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrations
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: myelin
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migrations
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {{- include "myelin.podSecurity" . | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-database-credentials
          image: {{ include "myelin.image" . | quote }}
          command: ["python", "-c"]
          args:
            - |
              import os, sys, time
              path = "/var/run/myelin-secrets/migrations-database-url"
              deadline = time.time() + 300
              while time.time() < deadline:
                  if os.path.isfile(path) and os.path.getsize(path) > 0:
                      sys.exit(0)
                  time.sleep(3)
              sys.exit("Timed out waiting for External Secrets database credentials")
          securityContext: {{- include "myelin.containerSecurity" . | nindent 12 }}
          volumeMounts: [{ name: platform-secrets, mountPath: /var/run/myelin-secrets, readOnly: true }]
      containers:
        - name: migrate
          image: {{ include "myelin.image" . | quote }}
          args: ["migrate"]
          env:
            - name: MYELIN_MIGRATIONS_DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.secrets.keys.migrationsDatabaseUrl }} } }
          securityContext: {{- include "myelin.containerSecurity" . | nindent 12 }}
          resources: { requests: { cpu: 100m, memory: 128Mi }, limits: { cpu: 500m, memory: 512Mi } }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: {} }
        - name: platform-secrets
          secret:
            secretName: {{ .Values.secrets.name }}
            optional: true
            items:
              - key: {{ .Values.secrets.keys.migrationsDatabaseUrl }}
                path: migrations-database-url
{{- end }}
