{{/* Copyright (c) 2026 Sudheer Kumar. SPDX-License-Identifier: AGPL-3.0-only.
     Syncs platform secrets from the customer's vault (HashiCorp Vault, Azure Key Vault, AWS Secrets Manager)
     via the External Secrets Operator. Nothing secret is stored in Git or in Helm values. */}}
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.name }}
  labels: {{- include "myelin.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval }}
  secretStoreRef: {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target: { name: {{ .Values.secrets.name }}, creationPolicy: Owner }
  data:
    {{- range $k, $v := .Values.secrets.keys }}
    - secretKey: {{ $v }}
      remoteRef: { key: {{ printf "%s/%s" $.Values.externalSecret.remoteKeyPrefix $v }} }
    {{- end }}
{{- end }}
