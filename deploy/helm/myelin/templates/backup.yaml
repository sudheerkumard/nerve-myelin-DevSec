{{/* Copyright (c) 2026 Sudheer Kumar. SPDX-License-Identifier: AGPL-3.0-only.
     Logical PostgreSQL backups (pg_dump custom format, compressed) streamed to object storage.
     Pair with the managed database's point-in-time recovery; see docs/enterprise/OPERATIONS.md. */}}
{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "myelin.name" . }}-backup
  labels: {{- include "myelin.labels" . | nindent 4 }}
  {{- with .Values.backup.serviceAccountAnnotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "myelin.name" . }}-backup-script
  labels: {{- include "myelin.labels" . | nindent 4 }}
data:
{{ (.Files.Glob "files/backup.sh").AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "myelin.name" . }}-backup
  labels: {{- include "myelin.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 7200
      template:
        metadata:
          labels:
            app.kubernetes.io/name: myelin
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/component: backup
            {{- if hasKey .Values.backup.serviceAccountAnnotations "azure.workload.identity/client-id" }}
            azure.workload.identity/use: "true"
            {{- end }}
        spec:
          restartPolicy: Never
          serviceAccountName: {{ include "myelin.name" . }}-backup
          automountServiceAccountToken: true   # projected token for cloud workload identity
          securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: backup
              image: {{ .Values.backup.image }}
              command: ["/bin/sh", "/scripts/backup.sh"]
              env:
                - { name: BACKUP_DEST, value: {{ .Values.backup.destination | quote }} }
                - { name: BACKUP_RETENTION_DAYS, value: {{ .Values.backup.retentionDays | quote }} }
                - name: MYELIN_MIGRATIONS_DATABASE_URL
                  valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: {{ .Values.secrets.keys.migrationsDatabaseUrl }} } }
              securityContext: {{- include "myelin.containerSecurity" . | nindent 16 }}
              resources: { requests: { cpu: 100m, memory: 256Mi }, limits: { cpu: "1", memory: 1Gi } }
              volumeMounts:
                - { name: scripts, mountPath: /scripts, readOnly: true }
                - { name: work, mountPath: /work }
          volumes:
            - { name: scripts, configMap: { name: {{ include "myelin.name" . }}-backup-script, defaultMode: 0555 } }
            - { name: work, emptyDir: { sizeLimit: 20Gi } }
{{- end }}
