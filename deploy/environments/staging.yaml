# RAT Flea DevSec staging environment.
# Keep identity, database, evidence storage and secret paths isolated from development and production.
image:
  repository: ghcr.io/sudheerkumard/nerve-myelin
  tag: "1.5.0"
  digest: ""
mode: enterprise
replicaCount: 2
workers: 2
publicUrl: https://myelin-staging.example.invalid
trustedProxies: "REPLACE_WITH_STAGING_INGRESS_CIDR"
identityProviders:
  providers:
    - name: staging-idp
      type: entra
      display_name: "Staging SSO"
      issuer: https://login.microsoftonline.com/REPLACE_WITH_STAGING_TENANT_ID/v2.0
      client_id: REPLACE_WITH_STAGING_CLIENT_ID
      client_secret_ref: env://MYELIN_OIDC_CLIENT_SECRET
      audiences: [REPLACE_WITH_STAGING_CLIENT_ID, api://myelin-staging]
      tenant_claim: tenant
      require_mfa: true
      role_mapping:
        NERvvE.TenantAdmin: tenant_admin
        NERvvE.SecurityLead: security_lead
        NERvvE.Developer: developer
        NERvvE.Auditor: auditor
        NERvvE.Viewer: viewer
externalSecret:
  enabled: true
  secretStoreRef: { kind: ClusterSecretStore, name: myelin-staging }
  remoteKeyPrefix: nerve-myelin/staging
secrets:
  name: myelin-staging-secrets
serviceAccount:
  create: true
  annotations:
    azure.workload.identity/client-id: REPLACE_WITH_STAGING_AZURE_CLIENT_ID
evidence:
  store: azblob://REPLACE_WITH_STAGING_STORAGE_ACCOUNT/myelin/evidence
  persistence: { enabled: false, size: 50Gi, storageClass: "" }
ingress:
  enabled: true
  host: myelin-staging.example.invalid
  tlsSecret: myelin-staging-tls
  certManager: { enabled: true, clusterIssuer: letsencrypt-staging }
networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring
  databaseCidr: REPLACE_WITH_STAGING_DATABASE_CIDR
  egressHttpsCidrs: ["REPLACE_WITH_STAGING_EGRESS_CIDR"]
autoscaling: { enabled: true, minReplicas: 2, maxReplicas: 4, targetCPU: 70 }
podDisruptionBudget: { enabled: true, minAvailable: 1 }
topologySpread: true
monitoring:
  serviceMonitor: { enabled: false, interval: 30s }
  prometheusRule: { enabled: false }
backup:
  enabled: true
  image: ghcr.io/sudheerkumard/nerve-myelin-backup:1.5.0
  serviceAccountAnnotations:
    azure.workload.identity/client-id: REPLACE_WITH_STAGING_BACKUP_AZURE_CLIENT_ID
  schedule: "17 2 * * *"
  destination: azblob://REPLACE_WITH_STAGING_BACKUP_ACCOUNT/postgres
  retentionDays: 14
