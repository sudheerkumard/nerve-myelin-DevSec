<!-- No external fonts or scripts: the console works air-gapped and sends no visitor data to third parties. -->
<style>
:root{
  --bg:#0b0f17;--bg2:#111726;--panel:#141b2d;--panel2:#1a2338;--line:#24304a;--line2:#2f3d5c;
  --tx:#e6ebf5;--tx2:#a5b0c7;--tx3:#6f7c98;
  --acc:#f5a524;--acc2:#ffcf6b;--blue:#5b8cff;--teal:#2dd4bf;--violet:#a78bfa;
  --crit:#ff4d6d;--high:#ff8a3d;--med:#f5c542;--low:#4cc9f0;--ok:#34d399;--info:#8b95ad;
  --r:10px;--mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --acctx:#1a1205;--hdr:rgba(11,15,23,.86);--navon:rgba(245,165,36,.16);--hero-a:rgba(245,165,36,.12);--hero-b:rgba(91,140,255,.12);
  --side:var(--bg2);--side-tx:var(--tx2);--side-tx3:var(--tx3);--side-hov:var(--panel);--side-on:var(--tx);--side-line:var(--line);--shadow:none;
}
[data-theme=corporate]{
  --bg:#f3f5f9;--bg2:#ffffff;--panel:#ffffff;--panel2:#f2f5fa;--line:#e2e7ef;--line2:#cfd7e3;
  --tx:#0b1a30;--tx2:#46566e;--tx3:#7a879b;
  --acc:#1747d1;--acc2:#2b5cf0;--acctx:#ffffff;--blue:#2b5cf0;--teal:#0d9488;--violet:#6d4ed8;
  --crit:#d4183d;--high:#dd5e0f;--med:#b98300;--low:#0880c2;--ok:#05916a;--info:#6b7790;
  --hdr:rgba(255,255,255,.92);--navon:rgba(255,255,255,.10);--hero-a:rgba(23,71,209,.10);--hero-b:rgba(13,148,136,.08);
  --side:#0c1218;--side-tx:#b8c4d8;--side-tx3:#7088ab;--side-hov:rgba(255,255,255,.06);--side-on:#ffffff;--side-line:rgba(255,255,255,.08);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 2px 8px rgba(16,24,40,.04);
}
[data-theme=corporate] .card,[data-theme=corporate] .plan,[data-theme=corporate] .hero{box-shadow:var(--shadow)}
[data-theme=corporate] .sev.medium{background:rgba(185,131,0,.12)}
[data-theme=corporate] .tenant{background:rgba(255,255,255,.05);border-color:var(--side-line);color:var(--side-tx)}
[data-theme=corporate] .tenant b{color:#fff}
[data-theme=corporate] .dec.warn{color:#8a6200}
*{box-sizing:border-box}html,body{margin:0;height:100%}
.chip,.clk{white-space:nowrap}td.mono{white-space:nowrap}
a.tl{display:block;color:inherit;text-decoration:none}a.tl .tile2{height:100%}a.tl:hover .tile2{border-color:var(--acc)}
.pchk{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line)}
.pchk .st{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
.st.pass{background:var(--ok)}.st.partial{background:var(--med)}.st.fail{background:var(--crit)}.st.na{background:var(--line2)}
.grade{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;font-weight:800;font-size:17px;color:#fff}
.grade.A{background:var(--ok)}.grade.B{background:#22b8a0}.grade.C{background:var(--med)}.grade.D{background:var(--high)}.grade.E{background:var(--crit)}
.clk{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;border:1px solid var(--line)}
.clk.overdue{background:color-mix(in srgb,var(--crit) 16%,transparent);border-color:var(--crit);color:var(--crit)}
.clk.due{background:color-mix(in srgb,var(--med) 14%,transparent);border-color:var(--med)}.clk.submitted{background:color-mix(in srgb,var(--ok) 14%,transparent);border-color:var(--ok)}
.ai-card{background:linear-gradient(135deg,color-mix(in srgb,var(--violet) 9%,var(--panel)),var(--panel));border-color:color-mix(in srgb,var(--violet) 40%,var(--line))}
.ai-h{color:var(--violet);font-weight:700;margin-bottom:8px;display:flex;gap:8px;align-items:center}
.ask{display:flex;gap:8px;align-items:center;margin-bottom:12px}.ask input{flex:1;min-width:0;font-size:14px;padding:10px 14px;border-radius:10px}
.dtabs{display:flex;gap:6px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.dtab{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);color:var(--tx2);padding:8px 16px;border-radius:999px;cursor:pointer}
.dtab.on{background:var(--acc);border-color:var(--acc);color:var(--acctx)}
.grid.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile2{position:relative;overflow:hidden;padding:14px 16px}
.pchain{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin-top:8px}.parr{align-self:center;color:var(--tx3);font-size:16px}
.pstep{border:1px solid var(--line);border-radius:8px;padding:6px 9px;min-width:110px;max-width:260px;background:var(--panel2)}
.pstep .pk{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx2);font-weight:600}.pstep .pl{font-size:12.5px;line-height:1.35;word-break:break-word}
.pstep.weakness,.pstep.runtime{border-color:var(--crit)}.pstep.identity{border-color:var(--high)}.pstep.data{border-color:var(--violet)}.pstep.exposure{border-color:var(--med)}
.ppath{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.ppath:last-child{border-bottom:0}.ppath:hover{background:var(--panel2)}
.tile2::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:var(--tc)}
.tile2 .t-l{font-size:11.5px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.05em;display:flex;align-items:center;gap:7px}
.tile2 .t-i{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:6px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc);font-size:12px}
.tile2 .t-v{font-size:30px;font-weight:800;margin-top:8px;letter-spacing:-.02em;line-height:1.1}
.tile2 .t-v small{font-size:14px;color:var(--tx3);font-weight:600;margin-left:2px}
.tile2 .t-s{font-size:12px;color:var(--tx2);margin-top:3px}
.chart text.ax{font-size:10.5px;fill:var(--tx3)} .chart .hit:hover{fill:color-mix(in srgb,var(--blue) 8%,transparent)}
.hs{display:grid;gap:9px} .hs-r{display:grid;grid-template-columns:minmax(120px,190px) 1fr 82px;gap:10px;align-items:center;font-size:12.5px}
.hs-l{color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis} .hs-t{height:14px}
.hs-b{display:flex;gap:2px;height:14px;border-radius:4px;overflow:hidden} .hs-b i{display:block;min-width:2px}
.hs-v{text-align:right;font-variant-numeric:tabular-nums}
.lg{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--tx2);margin-top:10px;font-weight:500;text-transform:none;letter-spacing:0}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
h3 .lg{margin-top:0}
@media(max-width:1200px){.grid.g5{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:760px){.grid.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.hs-r{grid-template-columns:110px 1fr 60px}}
body{background:var(--bg);color:var(--tx);font:14px/1.45 Inter,"Segoe UI",system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--blue);text-decoration:none}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-columns:232px 1fr;height:100vh}
aside{background:var(--side);border-right:1px solid var(--side-line);display:flex;flex-direction:column;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:18px 18px 14px;border-bottom:1px solid var(--side-line);color:var(--side-on)}
.brand b{font-size:17px;letter-spacing:.14em}.brand small{display:block;color:var(--side-tx3);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
nav{padding:10px 8px;flex:1}
nav .grp{color:var(--side-tx3);font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;padding:12px 10px 6px}
nav a{display:flex;align-items:center;gap:10px;color:var(--side-tx);padding:8px 10px;border-radius:7px;margin:1px 0}
nav a:hover{background:var(--side-hov);color:var(--side-on)}
nav a.on{background:linear-gradient(90deg,var(--navon),transparent);color:var(--side-on);box-shadow:inset 3px 0 0 #f5a524}
nav a .ct{margin-left:auto;font-size:11px;background:var(--side-hov);color:var(--side-tx);padding:1px 7px;border-radius:9px}
nav svg{width:16px;height:16px;flex:none;opacity:.85}
.tenant{margin:10px;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:12px;color:var(--tx2)}
.tenant b{color:var(--tx);display:block;font-size:13px}
main{overflow:auto;position:relative}
header.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:14px 26px;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header.top h1{font-size:18px;margin:0;font-weight:600}
header.top .sub{color:var(--tx3);font-size:12.5px}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:20px;font-size:12px;border:1px solid var(--line2);color:var(--tx2);background:var(--panel)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok)}
.btn{background:var(--panel2);border:1px solid var(--line2);color:var(--tx);padding:7px 13px;border-radius:8px;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--tx3)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acctx);font-weight:600}
.btn.pri:hover{background:var(--acc2)}
.btn.sm{padding:4px 9px;font-size:12px}
.wrap{padding:22px 26px 60px;max-width:1500px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:1fr 1fr}.g6{grid-template-columns:repeat(6,1fr)}
.g21{grid-template-columns:2fr 1fr}.g12{grid-template-columns:1fr 2fr}
@media(max-width:1200px){.g4,.g6{grid-template-columns:repeat(2,1fr)}.g3,.g21,.g12{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.card h3 .sp{flex:1}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.kpi .l{color:var(--tx3);font-size:12px;margin-top:2px}
.kpi .d{font-size:12px;margin-top:8px}
.up{color:var(--ok)}.dn{color:var(--crit)}
.sev{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.sev.critical{background:rgba(255,77,109,.15);color:var(--crit)}.sev.high{background:rgba(255,138,61,.15);color:var(--high)}
.sev.medium{background:rgba(245,197,66,.14);color:var(--med)}.sev.low{background:rgba(76,201,240,.13);color:var(--low)}.sev.info{background:rgba(139,149,173,.15);color:var(--info)}
.prio{font-family:var(--mono);font-weight:700;font-size:12px;padding:2px 7px;border-radius:5px}
.prio.P0{background:var(--crit);color:#fff}.prio.P1{background:var(--high);color:#1b0d00}.prio.P2{background:var(--panel2);color:var(--med);border:1px solid var(--line2)}.prio.P3{background:var(--panel2);color:var(--tx3);border:1px solid var(--line2)}
.eng{font-family:var(--mono);font-size:11px;color:var(--tx2);background:var(--bg2);border:1px solid var(--line);padding:1px 6px;border-radius:4px;text-transform:uppercase}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--tx3);font-weight:600;padding:9px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:var(--panel2);cursor:pointer}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--tx3)}.small{font-size:12px}
.bar{height:8px;background:var(--bg2);border-radius:5px;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.mrs{display:flex;align-items:center;gap:8px;min-width:110px}
.mrs .bar{flex:1;height:6px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,textarea,input:not([type]),input[type=text],input[type=number],input[type=password],input[type=url],input[type=email],input[type=date]{background:var(--bg2);border:1px solid var(--line2);color:var(--tx);border-radius:7px;padding:7px 10px;font:inherit}
input[type=text],input:not([type]){min-width:240px}
.chip{display:inline-block;padding:3px 8px;border-radius:6px;font-size:11.5px;border:1px solid var(--line2);color:var(--tx2);margin:2px 4px 2px 0}
.chip.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}.chip.bad{border-color:rgba(255,77,109,.45);color:var(--crit)}.chip.warn{border-color:rgba(245,197,66,.45);color:var(--med)}
.dec{font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:5px;text-transform:uppercase;letter-spacing:.05em}
.dec.pass{background:rgba(52,211,153,.14);color:var(--ok)}.dec.warn{background:rgba(245,197,66,.14);color:var(--med)}.dec.block{background:rgba(255,77,109,.16);color:var(--crit)}
.stages{display:flex;gap:3px}.stages i{width:22px;height:6px;border-radius:3px;background:var(--ok)}.stages i.failed{background:var(--crit)}.stages i.skipped{background:var(--line2)}
.drawer{position:fixed;top:0;right:0;width:min(640px,96vw);height:100vh;background:var(--bg2);border-left:1px solid var(--line2);z-index:30;transform:translateX(100%);transition:transform .22s ease;overflow:auto;box-shadow:-20px 0 60px rgba(0,0,0,.5)}
.drawer.open{transform:none}
.drawer .hd{padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg2);z-index:2}
.drawer .bd{padding:18px 22px}
.drawer h2{margin:6px 0 0;font-size:17px}
.kv{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;font-size:13px}.kv div:nth-child(odd){color:var(--tx3)}
pre{background:#070a10;border:1px solid var(--line);border-radius:8px;padding:12px 14px;overflow:auto;font:12.5px/1.55 var(--mono);color:#cfd8ea;margin:0}
pre .a{color:#54d38a}pre .r{color:#ff6b81}pre .y{color:#f5c542}pre .c{color:#7d8aa8}pre .b{color:#7aa2ff}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:25;display:none}.scrim.open{display:block}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(760px,94vw);max-height:88vh;overflow:auto;background:var(--bg2);border:1px solid var(--line2);border-radius:14px;z-index:40;display:none;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.modal.open{display:block}.modal .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal .bd{padding:18px 20px}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(30px);opacity:0;background:var(--panel2);border:1px solid var(--line2);padding:10px 16px;border-radius:9px;z-index:60;transition:.25s}
.toast.on{opacity:1;transform:translateX(-50%)}
.plans{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
@media(max-width:1300px){.plans{grid-template-columns:repeat(3,1fr)}}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;position:relative}
.plan.pop{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 12px 40px rgba(23,71,209,.12)}
.plan .tag{position:absolute;top:-10px;right:14px;background:var(--acc);color:var(--acctx);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:10px;letter-spacing:.06em}
.plan h4{margin:0;font-size:16px}.plan .tl{color:var(--tx3);font-size:12px;min-height:34px;margin-top:4px}
.plan .pr{font-size:30px;font-weight:700;margin:12px 0 2px}.plan .pr small{font-size:13px;color:var(--tx3);font-weight:400}
.plan ul{list-style:none;padding:0;margin:12px 0;font-size:12.5px;color:var(--tx2);flex:1}.plan li{padding:3px 0 3px 20px;position:relative}
.plan li:before{content:"";position:absolute;left:2px;top:9px;width:9px;height:5px;border-left:2px solid var(--ok);border-bottom:2px solid var(--ok);transform:rotate(-45deg)}
.yes{color:var(--ok);font-weight:700}.no{color:var(--tx3)}.q{color:var(--med)}
.term{background:#05070c;border:1px solid var(--line);border-radius:10px;padding:14px 16px;font:12.5px/1.6 var(--mono);min-height:280px;white-space:pre-wrap;color:#cfd8ea}
.eng-run{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:12px 0}
.eng-run div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;text-align:center;transition:.3s}
.eng-run div.run{border-color:var(--acc);color:var(--acc)}.eng-run div.done{border-color:rgba(52,211,153,.5);color:var(--ok)}
.hero{background:radial-gradient(1200px 300px at 0% 0%,var(--hero-a),transparent),radial-gradient(800px 300px at 100% 0%,var(--hero-b),transparent),var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px}
.hero h2{margin:0 0 6px;font-size:24px;letter-spacing:-.01em}
.diff .t{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:16px}
.diff h5{margin:0 0 6px;font-size:14px}.diff p{margin:0;color:var(--tx2);font-size:13px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--tx2);flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.hidden{display:none}
.banner{font-size:12px;color:var(--tx3);padding:6px 26px;border-bottom:1px solid var(--line);background:var(--bg2)}
.banner.lic-warn{color:#7c4a03;background:#fff5e0;font-weight:600}.banner.lic-bad{color:#fff;background:#b42318;font-weight:600}
.cover{border-radius:16px;padding:40px 40px 34px;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(900px 400px at 85% -10%,rgba(45,212,191,.30),transparent),radial-gradient(700px 300px at 0% 120%,rgba(59,130,246,.35),transparent),linear-gradient(135deg,#0c1218,#0f2a3a)}
.cover .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fb6dc}
.cover h2{font-size:34px;line-height:1.15;margin:10px 0 10px;max-width:820px;letter-spacing:-.02em;font-weight:800}
.cover p{color:#c9d6ea;max-width:760px;font-size:15px;margin:0}
.cover .meta{display:flex;gap:22px;margin-top:22px;flex-wrap:wrap;font-size:13px;color:#9fb6dc}.cover .meta b{color:#fff;font-weight:600}
.cover .cta{display:flex;gap:10px;margin-top:26px}.cover .btn{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.25);color:#fff}
.cover .btn.pri{background:#fff;border-color:#fff;color:#0c1218}
.cover .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-top:30px;background:rgba(255,255,255,.12);border-radius:12px;overflow:hidden}
.cover .stats div{background:rgba(10,31,60,.55);padding:16px 18px}.cover .stats b{display:block;font-size:26px;letter-spacing:-.02em}.cover .stats span{font-size:12px;color:#9fb6dc}
.flow{display:grid;grid-template-columns:repeat(6,1fr);gap:0;align-items:stretch}
.flow div{padding:16px;border:1px solid var(--line);background:var(--panel);position:relative}
.flow div:first-child{border-radius:10px 0 0 10px}.flow div:last-child{border-radius:0 10px 10px 0}.flow div+div{border-left:none}

function secretSteps() {
  modal("Revoke and rotate a leaked credential", `<ol style="line-height:1.7;padding-left:18px">

async function doTicket(id) {
  try {
    const r = await api("/api/v1/ticketing/tickets", {method: "POST", body: JSON.stringify({finding_ids: [id]})});
    const x = r.results[0];
    if (x.error) return toast(x.error);
    toast(`${r.integration}: ${x.ticket.key} created`); openFinding(id);
  } catch (e) { toast(e.message); }
}
async function doTriage(id, status, prefill) {
  const fp = status === "suppressed", d = new Date(Date.now() + 90 * 864e5).toISOString().slice(0, 10), max = new Date(Date.now() + 365 * 864e5).toISOString().slice(0, 10);
  modal(fp ? "Mark as false positive" : "Accept risk", `<p class="muted small" style="margin-top:0">${fp ? "The finding is closed and stays closed on future scans. The decision and your reason are kept in the audit trail and exported in VEX documents." : "The finding is excluded from gates and reports until the expiry date, then reopens automatically. The decision is audited."}</p>
    <div class="form"><label>Reason</label><textarea id="trR" rows="3" placeholder="${fp ? "e.g. test fixture, value is not a credential" : "e.g. compensating control: WAF rule 942100; fix scheduled in release 2026.12"}"></textarea>
    ${fp ? "" : `<label>Accepted until</label><input id="trE" type="date" value="${d}" min="${new Date(Date.now() + 864e5).toISOString().slice(0, 10)}" max="${max}">`}</div>
    <div style="margin-top:12px"><button class="btn pri" id="trGo">${fp ? "Mark false positive" : "Accept risk"}</button></div>`);
  if (prefill) $("#trR").value = prefill;
  $("#trGo").onclick = async () => {
    const reason = $("#trR").value.trim();
    if (reason.length < 5) return toast("A reason of at least 5 characters is required");
    try {
      await api(`/api/findings/${id}/status`, {method: "POST", body: JSON.stringify({status, reason: (fp ? "False positive: " : "") + reason, expires: fp ? null : $("#trE").value})});
      toast(fp ? "Marked as false positive" : `Risk accepted until ${$("#trE").value}`); closeAll(); if (VIEWS[location.hash.slice(1)]) VIEWS[location.hash.slice(1)]();
    } catch (e) { toast(e.message); }
  };
}
const diffHtml = d => esc(d || "").split("\n").map(l => l.startsWith("+") && !l.startsWith("+++") ? `<span class="a">${l}</span>` : l.startsWith("-") && !l.startsWith("---") ? `<span class="r">${l}</span>` : `<span class="c">${l}</span>`).join("\n");

      try { const pr = await api(`/api/findings/${id}/autofix/pull-request`, {method: "POST"}); $("#fixOut").innerHTML = `Opened <a href="${esc(pr.url)}" target="_blank" rel="noopener">#${esc(pr.number)}</a>`; }

const LIC_CAT = {permissive: ["Permissive", "ok"], weak_copyleft: ["Weak copyleft", "warn"], strong_copyleft: ["Strong copyleft", "bad"], network_copyleft: ["Network copyleft", "bad"], unknown: ["Unknown / custom", "warn"], invalid: ["Invalid expression", "bad"]};
function licAnalysis(x) {
  const leaf = b => { const c = LIC_CAT[b.category] || [b.category || "—", ""]; return `<span class="mono">${esc(b.identifier || b.expression || "?")}</span> <span class="chip ${c[1]}">${esc(c[0])}</span> → <b>${esc(b.decision || "")}</b>`; };
  const walk = (b, d) => (b.branches && b.branches.length) ? b.branches.map(y => walk(y, d + 1)).join("") : `<div style="padding-left:${d * 10}px">${leaf(b)}</div>`;
  if (!x.branches || !x.branches.length) { const c = LIC_CAT[x.category] || [x.category || "Not classified", ""]; return `<span class="chip ${c[1]}">${esc(c[0])}</span>`; }
  return `<div class="muted" style="margin-bottom:2px">${/ OR /.test(x.expression || "") ? "Choice of licences (OR)" : "All apply (AND)"}</div>` + walk(x, 0);
}

function cloudTable(items, empty, cols = "acct") {
  if (!items.length) return `<p class="muted small">${empty}</p>`;
  return `<table><tr><th>Severity</th><th>Finding</th><th>${cols === "acct" ? "Account" : "Namespace"}</th><th>Priority</th></tr>${items.map(f => `<tr class="click" data-id="${esc(f.id)}">
    <td><span class="sev ${f.severity}">${f.severity}</span></td><td><b>${esc(f.title)}</b><div class="muted small mono">${esc(f.rule_id)}${f.cis ? " · " + esc(f.cis) : ""}</div>${f.evidence ? `<div class="small mono" style="color:var(--tx2);max-width:620px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(f.evidence)}</div>` : ""}${f.source ? `<div class="small">⟵ code: <b>${esc(f.source.repo)}</b>${f.source.file ? ` <span class="mono muted">${esc(f.source.file)}</span>` : ""}</div>` : ""}</td>
    <td class="small">${cols === "acct" ? esc((f.repo || "").replace(/^cloud:/, "").replace(/^k8s:/, "k8s ")) : esc(f.namespace || "cluster")}</td><td><span class="prio ${f.priority}">${f.priority}</span></td></tr>`).join("")}</table>`;
}
async function cloudFindings(engines) {
  const r = await api(`/api/findings?engine=${engines}&limit=1000`);
  return r.items;
}

function dl(name, obj) {
  if (MODE !== "live") { navigator.clipboard.writeText(JSON.stringify(obj, null, 2)).then(() => toast(name + " copied to clipboard"), () => toast("Copy blocked by the browser — run the API to download")); return; }
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj, null, 2)], {type: "application/json"})); a.download = name; a.click(); }

async function openReport(id) {
  if (MODE !== "live") {
    const w = window.open(URL.createObjectURL(new Blob([S.dast.report], {type: "text/html"})), "_blank");
    return w || toast("Allow pop-ups to open the report");
  }
  const row = document.querySelector(`[data-rep="${id}"]`), name = row && row.closest("tr") ? row.closest("tr").querySelector("b").textContent : "application";
  reportDialog(name, async (q, dl) => {
    const r = await fetch(API_BASE + `/api/v1/dast/targets/${id}/report?` + q, {credentials: "same-origin", headers: authHeaders("GET")});
    if (!r.ok) return toast("Report not available: " + r.status);
    const u = URL.createObjectURL(new Blob([await r.text()], {type: "text/html"}));
    if (dl) { const a = document.createElement("a"); a.href = u; a.download = dl; a.click(); }
    else if (!window.open(u, "_blank")) toast("Allow pop-ups to open the report");
  }, "Application & API Security Assessment");

async function runTarget(id, btn) {
  btn.disabled = true; btn.textContent = "Running…";
  try { await api(`/api/v1/dast/targets/${id}/run`, {method: "POST"}); } catch (e) { toast(e.message); btn.disabled = false; btn.textContent = "▶ Run"; return; }
  for (let i = 0; i < 150; i++) {
    await new Promise(r => setTimeout(r, 2000));
    const t = await api(`/api/v1/dast/targets/${id}`);
    if (t.status !== "running") { toast(t.status === "done" ? `Assessment complete: ${t.summary.findings} findings, gate ${t.summary.decision}` : "Run failed: " + t.last_error); break; }
  }
  if (location.hash === "#apptest") VIEWS.apptest();
}

  S.autofix = id => { const r = (SNAPSHOT.autofix || {})[id]; if (r) return r;
    const f = S.findings.find(x => x.id === id) || {}; return {proposed: false, guidance: f.remediation || "AutoFix computes patches from the repository's files; this demo repository has no source files in the offline snapshot."}; };
  S.explain = id => { const f = S.findings.find(x => x.id === id), w = [];
    if (f.kev) w.push("listed in CISA KEV — actively exploited in the wild"); if (f.epss) w.push(`EPSS ${(f.epss * 100).toFixed(0)}% probability of exploitation in the next 30 days`);
    if (f.reachable) w.push("vulnerable code path is reachable from your application entry points"); if (f.exposure === "internet") w.push("the service is internet-facing"); if (f.validated) w.push("the provider confirmed the credential is live"); else if (f.high_confidence) w.push("the credential matches the provider's exact key format; treat it as live until rotated");
