[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nerve-myelin"
version = "1.9.0"
description = "RAT Flea DevSec scan engine and pipeline gate CLI"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Sudheer Kumar"}]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3", "Topic :: Security"]
dependencies = ["pyyaml>=6.0", "packaging>=23.0", "bandit>=1.7.9", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
myelin = "myelin_engine.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]

[tool.setuptools.package-data]
myelin_engine = ["rules/sast/*.yaml", "data/*", "data/**/*"]
