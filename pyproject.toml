[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nerve-myelin"
version = "1.5.0"
description = "NERvvE DevSecOps scan engine and pipeline gate CLI"
requires-python = ">=3.10"
license = {text = "AGPL-3.0-only"}
authors = [{name = "Sudheer Kumar"}]
classifiers = ["License :: OSI Approved :: GNU Affero General Public License v3", "Topic :: Security"]
dependencies = ["pyyaml>=6.0", "packaging>=23.0", "bandit>=1.7.9"]

[project.scripts]
myelin = "myelin_engine.cli:main"

[tool.setuptools.packages.find]
where = ["engine"]
