name: Feature request
description: Suggest a new check, integration or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like RAT Flea DevSec to do?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Anything else (tools, standards, examples)?
