name: Bug report
description: Something in NERvvE DevSecOps does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Issues are **public**. Never post credentials, tokens, private code or customer data.
        Security vulnerabilities: follow [SECURITY.md](../../SECURITY.md) instead of opening an issue.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, a minimal repository or a policy file that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and environment
      description: "`myelin --version`, operating system, Python version, Docker or Helm"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      render: shell
