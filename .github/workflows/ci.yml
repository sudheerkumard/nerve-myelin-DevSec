# NERvvE DevSecOps — product CI: tests (incl. real PostgreSQL RLS isolation), self-scan, supply-chain gates,
# hardened image build, vulnerability scan, SBOM, keyless signing and provenance.
name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_call:          # reused by release.yml as the release gate
permissions: { contents: read, pull-requests: read }
concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      MYELIN_TEST_PG: "host=localhost port=5432 user=postgres password=postgres"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r backend/requirements.txt -r backend/requirements-dev.txt
      - name: Unit, API, auth, connector, evidence and tenant-isolation tests
        working-directory: backend
        run: python -m pytest -q --junitxml=../test-results.xml
      - name: Migrations apply cleanly and are reversible-safe
        working-directory: backend
        run: python -c "from tests.pg import provision, drop; u = provision(); drop(u['db'])"
      - name: Scanner engine unit and lockfile coverage tests
        env:
          PYTHONPATH: engine
        run: python -m pytest -q engine/tests --junitxml=engine-test-results.xml
      - name: Measure repository and SBOM accuracy against labelled fixtures
        if: always()
        run: python scripts/scan_benchmark.py --output scan-accuracy.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: scan-validation
          path: |
            engine-test-results.xml
            scan-accuracy.json
      - name: Build demo snapshot and clean enterprise console
        run: |
          python scripts/build_console.py
          python scripts/build_enterprise_console.py
          ! grep -q 'nm_demo_9f2c41e7b8' console/index.html
          ! grep -q 'Orion Financial Group' console/index.html
          grep -q 'Orion Financial Group' demo/offline/NERvvE-DevSecOps-Demo-Console.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with: { name: test-results, path: test-results.xml }

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - name: NERvvE DevSecOps self-scan (secrets, IaC, CI/CD posture) — policy gate
        run: |
          pip install -r backend/requirements.txt
          python cli/myelin.py scan . --builtin-only --policy policies/myelin-policy.yaml \
            --require sast,secrets,iac,cicd --sarif myelin.sarif --json myelin.json \
            --sbom source-sbom.cdx.json --fail-on block
      - name: Dockerfile lint (hadolint)
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf  # v3.1.0
        with: { dockerfile: Dockerfile, config: .hadolint.yaml }
      - name: Dependency vulnerabilities (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --strict
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        if: always()
        with:
          name: myelin-sarif
          path: |
            myelin.sarif
            myelin.json
            source-sbom.cdx.json

  image:
    needs: [test, security]
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/nerve-myelin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        if: github.event_name != 'pull_request'
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Container vulnerability scan (Trivy) — fail on fixable critical/high
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0  # v0.28.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build dedicated backup runtime
        id: backup
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile.backup
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ghcr.io/${{ github.repository_owner }}/nerve-myelin-backup:${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Backup runtime vulnerability scan (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/nerve-myelin-backup:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Build isolated sample-data demo image (never publish)
        run: docker build --file Dockerfile.demo --tag ghcr.io/sudheerkumard/nerve-myelin-demo:ci .
      - name: Hardening checks (non-root, no package manager in runtime)
        run: |
          docker run --rm --entrypoint id "$IMAGE:${{ github.sha }}" | grep -q "uid=10001"
          ! docker run --rm --entrypoint sh "$IMAGE:${{ github.sha }}" -c "command -v pip"
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0
        with: { image: "${{ env.IMAGE }}:${{ github.sha }}", format: cyclonedx-json, output-file: sbom.cdx.json }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
        if: github.event_name != 'pull_request'
      - name: Keyless sign image and attach SBOM attestation
        if: github.event_name != 'pull_request'
        run: |
          cosign sign --yes "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@${{ steps.build.outputs.digest }}"
          cosign sign --yes "ghcr.io/${{ github.repository_owner }}/nerve-myelin-backup@${{ steps.backup.outputs.digest }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: { name: sbom, path: sbom.cdx.json }

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
      - run: |
          set -euo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          for values in deploy/environments/development.yaml deploy/environments/staging.yaml deploy/environments/production.yaml config/deploy/values-customer.example.yaml; do
            helm lint deploy/helm/myelin -f "$values"
            helm template myelin deploy/helm/myelin -f "$values" > rendered.yaml
            ./kubeconform -strict -summary -ignore-missing-schemas rendered.yaml
          done
          helm lint deploy/helm/myelin -f config/deploy/values-customer.example.yaml
        shell: bash
