[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
# URL comes from MYELIN_MIGRATIONS_DATABASE_URL (owner role) — see migrations/env.py

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
