#
# Trusted identity providers. Keycloak is the reference IdP shipped with RAT Flea DevSec; customers may use
# any OIDC provider instead or as well. SAML-only IdPs (ADFS, PingFederate, Shibboleth) are brokered
# through Keycloak. Several providers can be trusted at the same time.
#
# Per provider:
#   type           keycloak | entra | okta | auth0 | ping | google | generic  (sets sensible defaults below)
#   issuer         exact `iss` value; discovery at <issuer>/.well-known/openid-configuration
#   client_id      OIDC client registered for RAT Flea DevSec (also the expected audience unless `audiences` given)
#   client_secret_ref  secret REFERENCE for the console's confidential client (never a literal secret)
#   tenant_claim   claim holding the customer's tenant identifier; bound to a RAT Flea tenant by the platform admin:
#                  python -m app.admin_cli bind --tenant <slug> --issuer <issuer> --value <claim value>
#   role_claims    claim paths holding roles/groups;  role_mapping  IdP value -> RAT Flea role
#   require_mfa    reject tokens without an MFA signal (acr_values / amr_values); triggers RFC 9470 step-up
# RAT Flea roles: tenant_admin, security_lead, policy_approver, developer, auditor, viewer, integration
providers:
  - name: keycloak
    type: keycloak
    issuer: https://auth.example.com/realms/myelin
    client_id: myelin-console
    client_secret_ref: env://MYELIN_OIDC_KEYCLOAK_SECRET
    audiences: [myelin-console, myelin-api]
    require_mfa: true
    role_mapping:
      myelin-tenant-admin: tenant_admin
      myelin-security-lead: security_lead
      myelin-policy-approver: policy_approver
      myelin-developer: developer
      myelin-auditor: auditor
      myelin-viewer: viewer
      myelin-integration: integration

  # Customer-owned Microsoft Entra ID (uncomment and fill in per customer)
  # - name: contoso-entra
  #   type: entra
  #   issuer: https://login.microsoftonline.com/<tenant-guid>/v2.0
  #   client_id: <application-id>
  #   client_secret_ref: azkv://<vault>/myelin-entra-client-secret
  #   role_mapping: { NERvvE.TenantAdmin: tenant_admin, NERvvE.SecurityLead: security_lead, NERvvE.Developer: developer, NERvvE.Auditor: auditor, NERvvE.Viewer: viewer }

  # Customer-owned Okta
  # - name: acme-okta
  #   type: okta
  #   issuer: https://acme.okta.com/oauth2/default
  #   client_id: <client-id>
  #   client_secret_ref: vault://secret/myelin/okta#client_secret
  #   role_mapping: { myelin-admins: tenant_admin, appsec: security_lead, engineering: developer, audit: auditor }
